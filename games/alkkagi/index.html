<!DOCTYPE html>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');

      width: 100%;

      overflow: hidden;

      margin-bottom: max(6px, env(safe-area-inset-bottom, 6px)) !important;
    }
  </style>
</head>
<body id="app-root" class="text-white flex flex-col justify-between items-center p-1 sm:p-2 overflow-hidden box-border">

      <!-- 상단: 5대 영웅급 -->

      <div class="grid grid-cols-5 gap-1 text-center">

        <button onclick="buyPiece('HERO_홍구')" class="bg-gradient-to-b from-amber-600/30 to-slate-900 border-2 border-yellow-400/90 p-1 rounded-xl flex flex-col items-center shadow active:scale-95">
          <span class="text-[10px] font-black text-yellow-300 truncate w-full">홍구</span>
          <span class="text-[8px] text-amber-300 font-bold">8P</span>
        </button>
        <button onclick="buyPiece('HERO_창궈니')" class="bg-gradient-to-b from-amber-600/30 to-slate-900 border-2 border-yellow-400/90 p-1 rounded-xl flex flex-col items-center shadow active:scale-95">
          <span class="text-[10px] font-black text-yellow-300 truncate w-full">창궈니</span>
          <span class="text-[8px] text-amber-300 font-bold">8P</span>
        </button>
        <button onclick="buyPiece('HERO_하도리')" class="bg-gradient-to-b from-amber-600/30 to-slate-900 border-2 border-yellow-400/90 p-1 rounded-xl flex flex-col items-center shadow active:scale-95">
          <span class="text-[10px] font-black text-yellow-300 truncate w-full">하도리</span>

        <button onclick="buyPiece('HERO_현조')" class="bg-gradient-to-b from-amber-600/30 to-slate-900 border-2 border-yellow-400/90 p-1 rounded-xl flex flex-col items-center shadow active:scale-95">
          <span class="text-[10px] font-black text-yellow-300 truncate w-full">현조</span>

      <!-- 하단: 장기 정규 기물 -->

        </button>
        <button onclick="buyPiece('車')" class="bg-slate-800 hover:bg-slate-700 border border-cyan-400/80 p-0.5 rounded-xl flex flex-col items-center active:scale-95">
          <span class="text-[10px] font-black text-cyan-300">차(車)</span>
          <span class="text-[8px] text-amber-400 font-bold">5P</span>
        </button>
        <button onclick="buyPiece('包')" class="bg-slate-800 hover:bg-slate-700 border border-purple-400/80 p-0.5 rounded-xl flex flex-col items-center active:scale-95">

        <button onclick="buyPiece('馬')" class="bg-slate-800 hover:bg-slate-700 border border-orange-400/80 p-0.5 rounded-xl flex flex-col items-center active:scale-95">
          <span class="text-[10px] font-black text-orange-300">마(馬)</span>

        <button onclick="buyPiece('象')" class="bg-slate-800 hover:bg-slate-700 border border-amber-400/80 p-0.5 rounded-xl flex flex-col items-center active:scale-95">

        </button>
        <button onclick="buyPiece('卒')" class="bg-slate-800 hover:bg-slate-700 border border-slate-400/80 p-0.5 rounded-xl flex flex-col items-center active:scale-95">

    <!-- 2. 배틀 단계: 타이밍 바운스 파워 패널 + 조준 취소 버튼 -->
    <div id="battle-panel" class="hidden flex flex-col gap-1.5">
      <div class="flex justify-between items-center px-1">
        <div id="battle-status-msg" class="text-[11px] text-slate-300 truncate">
          <span class="text-amber-400 font-bold">1단계:</span> 말을 누르고 조준한 뒤 손을 떼세요!
        </div>
        <div class="text-[10px] font-bold text-emerald-400" id="current-map-title">요새 격전지</div>
      </div>

      <div id="power-control-group" class="flex items-center gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-700">
        <button id="cancel-aim-btn" onclick="cancelAiming()" disabled class="px-2.5 py-1.5 bg-slate-800 text-slate-500 rounded-xl text-xs font-bold shadow transition-all whitespace-nowrap border border-slate-700">
          ↩ 취소
        </button>

        <span class="text-[10px] font-black text-amber-300 whitespace-nowrap">파워</span>
        
        <div id="power-track" class="flex-1 h-5 bg-slate-800 rounded-lg overflow-hidden relative border border-slate-600">
          <div id="power-fill" class="h-full bg-gradient-to-r from-emerald-500 via-yellow-400 to-rose-600" style="width: 0%;"></div>
          <div class="absolute right-0 top-0 bottom-0 w-[4%] bg-rose-400/40 border-l border-yellow-300 animate-pulse"></div>
          <span id="power-text" class="absolute inset-0 flex items-center justify-center text-[10px] font-black text-white drop-shadow">0%</span>
        </div>

        <button id="shoot-btn" onclick="executeTimingShot()" disabled class="px-3.5 py-1.5 bg-slate-700 text-slate-400 rounded-xl text-xs font-black shadow transition-all whitespace-nowrap">
          조준 대기
        </button>
      </div>

  <script>
    const canvas = document.getElementById('alkkagiCanvas');
    const ctx = canvas.getContext('2d');

    window.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    const heroImageFiles = {
      '세미니': '세미니.jpeg',
      '홍구': '홍구.jpeg',
      '창궈니': '창궈니.jpeg',
      '하도리': '하도리.jpeg',
      '현조': '현조.jpeg'
    };
    const loadedImages = {};
    for (const [key, filename] of Object.entries(heroImageFiles)) {
      const img = new Image();
      img.src = filename;
      loadedImages[key] = img;
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let lastClackTime = 0;
    let lastSlideTime = 0;

    function playWoodClack(intensity = 0.5, massRatio = 1.0) {
      const now = performance.now();
      if (now - lastClackTime < 38) return;
      lastClackTime = now;

      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const vol = Math.min(1.0, Math.max(0.12, intensity));

        const bufferSize = audioCtx.sampleRate * 0.028;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.16));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        const centerFreq = Math.max(900, 1800 - massRatio * 150);
        noiseFilter.frequency.setValueAtTime(centerFreq, t);
        noiseFilter.Q.setValueAtTime(3.8, t);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(vol * 0.9, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.028);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(t);

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        const startPitch = Math.max(180, 480 - massRatio * 40);
        const endPitch = Math.max(50, 110 - massRatio * 10);
        osc.frequency.setValueAtTime(startPitch, t);
        osc.frequency.exponentialRampToValueAtTime(endPitch, t + 0.075);

        oscGain.gain.setValueAtTime(vol * 0.75, t);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.075);

        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      } catch(e) {}
    }

    function playCriticalShotSfx() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, t);
        osc.frequency.exponentialRampToValueAtTime(1400, t + 0.22);
        gain.gain.setValueAtTime(0.9, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.25);
      } catch(e) {}
    }

    function playSlideFriction(speed) {
      if (speed < 1.4) return;
      const now = performance.now();
      if (now - lastSlideTime < 90) return;
      lastSlideTime = now;

      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const dur = 0.06;
        const bufferSize = audioCtx.sampleRate * dur;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.25;
        }
        const slideNoise = audioCtx.createBufferSource();
        slideNoise.buffer = buffer;

        const slideFilter = audioCtx.createBiquadFilter();
        slideFilter.type = 'lowpass';
        slideFilter.frequency.setValueAtTime(650, t);

        const slideGain = audioCtx.createGain();
        const vol = Math.min(0.25, (speed / 16) * 0.2);
        slideGain.gain.setValueAtTime(vol, t);
        slideGain.gain.linearRampToValueAtTime(0.001, t + dur);

        slideNoise.connect(slideFilter);
        slideFilter.connect(slideGain);
        slideGain.connect(audioCtx.destination);
        slideNoise.start(t);
      } catch(e) {}
    }

    function playExplosionSfx(vol = 0.6) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.3);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.32);
      } catch(e) {}
    }

    function playJumpSfx() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.18);
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      } catch(e) {}
    }

    function playFallSfx() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, t);
        osc.linearRampToValueAtTime(45, t + 0.3);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.33);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.33);
      } catch(e) {}
    }

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, t);
        osc.linearRampToValueAtTime(950, t + 0.25);
        gain.gain.setValueAtTime(0.6, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);

    function generateRandomMap() {
      const w = boardBounds.width;
      const h = boardBounds.height;
      const bx = boardBounds.left;
      const by = boardBounds.top;

      currentMap.walls = [];
      currentMap.obstacles = [];

      const midY = by + h * 0.5;
      const segW = w / 5;
      const wallBaseHp = 95;

      currentMap.walls.push({ x1: bx, y1: midY, x2: bx + segW * 1.35, y2: midY, color: '#38bdf8', hp: wallBaseHp, maxHp: wallBaseHp });
      currentMap.walls.push({ x1: bx + segW * 1.85, y1: midY, x2: bx + segW * 3.15, y2: midY, color: '#38bdf8', hp: wallBaseHp, maxHp: wallBaseHp });
      currentMap.walls.push({ x1: bx + segW * 3.65, y1: midY, x2: bx + w, y2: midY, color: '#38bdf8', hp: wallBaseHp, maxHp: wallBaseHp });

      currentMap.walls.push({ x1: bx, y1: by + h * 0.25, x2: bx, y2: by + h * 0.35, color: '#94a3b8', hp: wallBaseHp, maxHp: wallBaseHp });
      currentMap.walls.push({ x1: bx + w, y1: by + h * 0.25, x2: bx + w, y2: by + h * 0.35, color: '#94a3b8', hp: wallBaseHp, maxHp: wallBaseHp });
      currentMap.walls.push({ x1: bx, y1: by + h * 0.65, x2: bx, y2: by + h * 0.75, color: '#94a3b8', hp: wallBaseHp, maxHp: wallBaseHp });
      currentMap.walls.push({ x1: bx + w, y1: by + h * 0.65, x2: bx + w, y2: by + h * 0.75, color: '#94a3b8', hp: wallBaseHp, maxHp: wallBaseHp });

      const obstacleTypes = ['mountain', 'water_puddle', 'sawblade', 'twin_blade', 'mud'];
      const targetCount = 6;
      let placed = 0;
      let attempts = 0;

      while (placed < targetCount && attempts < 150) {
        attempts++;
        const obsType = obstacleTypes[placed % obstacleTypes.length];
        
        let candidateR = w * 0.04;
        if (obsType === 'mountain') candidateR = w * 0.038;
        if (obsType === 'water_puddle') candidateR = w * 0.055;
        if (obsType === 'twin_blade') candidateR = w * 0.06;

        const ox = bx + candidateR + 10 + Math.random() * (w - candidateR * 2 - 20);
        const oy = by + h * 0.32 + Math.random() * (h * 0.36);

        let wallOverlap = false;
        currentMap.walls.forEach(wl => {
          const { dist } = pointToSegmentDistance(ox, oy, wl.x1, wl.y1, wl.x2, wl.y2);
          if (dist < candidateR + 15) wallOverlap = true;
        });
        if (wallOverlap) continue;

        let obsOverlap = false;
        for (const existing of currentMap.obstacles) {
          const d = Math.hypot(existing.x - ox, existing.y - oy);
          const reqDist = (existing.boundR || existing.r || 25) + candidateR + 18;
          if (d < reqDist) {
            obsOverlap = true;
            break;
          }
        }
        if (obsOverlap) continue;

        const baseHp = 85;

        if (obsType === 'mountain') {
          const r = w * (0.028 + Math.random() * 0.01);
          const points = [];
          const numPts = 7;
          for (let p = 0; p < numPts; p++) {
            const ang = (Math.PI * 2 / numPts) * p;
            const dist = r * (0.75 + Math.random() * 0.45);
            points.push({ x: Math.cos(ang) * dist, y: Math.sin(ang) * dist });
          }
          currentMap.obstacles.push({ type: 'mountain', x: ox, y: oy, r, boundR: r, points, hp: baseHp, maxHp: baseHp });
        } else if (obsType === 'water_puddle') {
          const rx = w * (0.045 + Math.random() * 0.015);
          const ry = h * (0.035 + Math.random() * 0.012);
          currentMap.obstacles.push({ type: 'water_puddle', x: ox, y: oy, rx, ry, r: (rx + ry) / 2, boundR: rx, hp: baseHp, maxHp: baseHp });
        } else if (obsType === 'sawblade') {
          const r = w * 0.028;
          currentMap.obstacles.push({ type: 'sawblade', x: ox, y: oy, r, boundR: r, angle: 0, speed: (Math.random() > 0.5 ? 1 : -1) * 0.06, hp: baseHp, maxHp: baseHp });
        } else if (obsType === 'twin_blade') {
          const len = w * (0.045 + Math.random() * 0.015);
          currentMap.obstacles.push({ type: 'twin_blade', x: ox, y: oy, len, boundR: len, angle: Math.random() * Math.PI, speed: (Math.random() > 0.5 ? 1 : -1) * 0.03, hp: baseHp, maxHp: baseHp });
        } else if (obsType === 'mud') {
          const r = w * (0.04 + Math.random() * 0.015);
          currentMap.obstacles.push({ type: 'mud', x: ox, y: oy, r, boundR: r, hp: baseHp, maxHp: baseHp });
        }

        placed++;
      }
    }

    function setupConnectionEvents() {
      peerConn.on('open', () => {
        peerConn.send({
          type: 'HANDSHAKE',
          nickname: localStorage.getItem('jg_permanent_nickname') || '도전자',
          map: isHost ? currentMap : null
        });
      });

      peerConn.on('data', data => {
        if (data.type === 'HANDSHAKE') {
          document.getElementById('opp-name').innerText = data.nickname;
          if (!isHost && data.map) currentMap = data.map;
        } else if (data.type === 'READY_SYNC') {
          isPeerReady = true;
          const oppSide = (mySide === 'cho') ? 'han' : 'cho';
          const oppPieces = data.pieces.map(p => ({
            ...p,
            side: oppSide,
            color: (oppSide === 'cho') ? '#064e3b' : '#7f1d1d',
            alive: true,
            vx: 0, vy: 0,
            isJumping: false,
            jumpTime: 0,
            curveTimer: 0,
            hitCooldown: 0
          }));
          pieces = pieces.filter(p => p.side === mySide).concat(oppPieces);
          checkStartBattle();
        } else if (data.type === 'SHOOT') {
          const shooter = pieces.find(p => p.id === data.id);
          if (shooter) {
            shooter.vx = data.vx;
            shooter.vy = data.vy;
            if (shooter.ability === 'cannon') {
              shooter.isJumping = true;
              shooter.jumpTime = 22;
              playJumpSfx();
            } else {
              playWoodClack(0.85, shooter.mass);
            }
            isSimulating = true;
          }
        } else if (data.type === 'TIMEOUT_PASS') {
          forceTurnPass();
        } else if (data.type === 'REMATCH_REQUEST') {
          handleInstantRematch(data.map);
        }
      });
    }

    function startTimer(duration) {
      if (timerInterval) clearInterval(timerInterval);
      timerTotal = duration;
      timerRemaining = duration;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        if (isGameOver) {
          clearInterval(timerInterval);
          return;
        }

        if (isPowerBouncing && gamePhase === 'battle') {
          if (timerRemaining > 1) {
            timerRemaining--;
            updateTimerDisplay();
          }
          return;
        }

        timerRemaining--;
        updateTimerDisplay();

        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeOut();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const tb = document.getElementById('timer-badge');
      const tp = document.getElementById('timer-progress');
      tb.innerText = `${Math.max(0, timerRemaining)}초`;
      const ratio = Math.max(0, timerRemaining / timerTotal);
      tp.style.width = `${ratio * 100}%`;

      if (ratio < 0.25) {
        tp.className = 'bg-rose-500 h-full transition-all duration-300';
      } else {
        tp.className = 'bg-gradient-to-r from-emerald-500 to-amber-500 h-full transition-all duration-300';
      }
    }

    function handleTimeOut() {
      if (isGameOver) return;
      if (gamePhase === 'placement') {
        if (!isMyReady) toggleReady();
      } else if (gamePhase === 'battle') {
        if (currentTurn === mySide) {
          deselectPiece();
          if (peerConn && peerConn.open) {
            peerConn.send({ type: 'TIMEOUT_PASS' });
          }
          forceTurnPass();
        }
      }
    }

        { type: '馬', x: bLeft + bW * 0.50, y: zTop + zH * 0.25 }

      formation.forEach(item => {

            id: p.id,
            side: p.side,
            char: p.char,
            heroKey: p.heroKey,
            x: p.x,
            y: p.y,
            mass: p.mass,
            radius: p.radius,
            ringWidth: p.ringWidth,
            color: p.color,
            border: p.border,
            ability: p.ability,
            shield: p.shield
          }))
        });
      }

      if (isAIMode) isPeerReady = true;
      checkStartBattle();
    }

    function checkStartBattle() {
      if (isMyReady && isPeerReady) {
        gamePhase = 'battle';
        document.getElementById('placement-panel').classList.add('hidden');
        document.getElementById('battle-panel').classList.remove('hidden');

        currentTurn = 'cho';
        const badge = document.getElementById('game-phase-badge');
        if (mySide === 'cho') {
          badge.innerText = '초(내 턴)';
          badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs font-black bg-emerald-600 text-white shadow animate-pulse';
        } else {
          badge.innerText = '상대 턴 진행 중...';
          badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs font-black bg-red-600 text-white shadow animate-pulse';
        }

        updateBattleControlUI();
        updateUI();
        startTimer(20);
      }
    }

    function updateUI() {
      document.getElementById('budget-display').innerText = budget;
      const choCount = pieces.filter(p => p.side === 'cho' && p.alive).length;
      const hanCount = pieces.filter(p => p.side === 'han' && p.alive).length;

      document.getElementById('my-pieces-count').innerText = `남은 기물: ${mySide === 'cho' ? choCount : hanCount}`;
      if (gamePhase === 'placement') {
        document.getElementById('opp-pieces-count').innerText = '배치 중 (비공개)';
      } else {
        document.getElementById('opp-pieces-count').innerText = `남은 기물: ${mySide === 'cho' ? hanCount : choCount}`;
      }

      if (gamePhase === 'battle' && !isGameOver) {
        if (choCount === 0) endGame('han');
        else if (hanCount === 0) endGame('cho');
      }
    }

    function endGame(winner) {
      isGameOver = true;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;

      const modal = document.getElementById('game-over-modal');
      const title = document.getElementById('over-title');
      const desc = document.getElementById('over-desc');

      if (winner === mySide) {
        title.innerText = '👑 판쓸이 대승리! 👑';
        title.className = 'text-xl sm:text-2xl font-black title-font text-emerald-400';
        desc.innerText = '전략적인 타격으로 적 진영을 완벽히 소탕했습니다!';
      } else {
        title.innerText = '💀 패배 💀';
        title.className = 'text-xl sm:text-2xl font-black title-font text-rose-500';
        desc.innerText = '아군의 모든 기물이 장외로 떨어졌습니다.';
      }
      modal.classList.remove('hidden');
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    let isMovingPlacement = false;

    function handlePointerStart(e) {
      if (e.cancelable) e.preventDefault();
      const pos = getCanvasPos(e);

      if (gamePhase === 'placement') {
        const target = pieces.find(p => p.side === mySide && Math.hypot(p.x - pos.x, p.y - pos.y) <= p.radius * 2.2);
        if (target) {
          isMovingPlacement = true;
          selectedPiece = target;
        }
      } else if (gamePhase === 'battle') {
        if (isSimulating || isGameOver || currentTurn !== mySide) return;

        if (isPowerBouncing && selectedPiece) {
          executeTimingShot();
          return;
        }

        const clickedPiece = pieces.find(p => p.alive && p.side === mySide && Math.hypot(p.x - pos.x, p.y - pos.y) <= p.radius * 2.2);

        if (clickedPiece) {
          selectedPiece = clickedPiece;
          isAimDragging = true;
          isPowerBouncing = false;
          aimAngle = (mySide === 'cho') ? -Math.PI / 2 : Math.PI / 2;
          bouncePower = 0;
          updateBattleControlUI();
          playWoodClack(0.4, selectedPiece.mass);
        }
      }
    }

    function handlePointerMove(e) {
      if (e.cancelable) e.preventDefault();
      const pos = getCanvasPos(e);

      if (gamePhase === 'placement' && isMovingPlacement && selectedPiece) {
        const r = selectedPiece.radius;
        selectedPiece.x = Math.max(boardBounds.left + r, Math.min(boardBounds.right - r, pos.x));
        selectedPiece.y = Math.max(mySpawnZone.top + r, Math.min(mySpawnZone.bottom - r, pos.y));
      } else if (gamePhase === 'battle' && selectedPiece && isAimDragging) {
        const dx = pos.x - selectedPiece.x;
        const dy = pos.y - selectedPiece.y;
        if (Math.hypot(dx, dy) > 8) {
          aimAngle = Math.atan2(dy, dx);
        }
      }
    }

    function handlePointerEnd(e) {
      if (gamePhase === 'placement') {
        isMovingPlacement = false;
      } else if (gamePhase === 'battle') {
        if (isAimDragging && selectedPiece) {
          isAimDragging = false;
          isPowerBouncing = true;
          bounceDirection = 1;
          lastBounceTime = performance.now();
          updateBattleControlUI();
        }
      }
    }

    canvas.addEventListener('touchstart', handlePointerStart, { passive: false });
    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerEnd, { passive: false });

    canvas.addEventListener('mousedown', handlePointerStart);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerEnd);

    function cancelAiming() {
      if (!selectedPiece || isSimulating) return;
      deselectPiece();
    }

    function updateBattleControlUI() {
      const shootBtn = document.getElementById('shoot-btn');
      const cancelBtn = document.getElementById('cancel-aim-btn');
      const msg = document.getElementById('battle-status-msg');

      if (isPowerBouncing && selectedPiece) {
        shootBtn.disabled = false;
        cancelBtn.disabled = false;
        cancelBtn.className = 'px-2.5 py-1.5 bg-rose-900/60 hover:bg-rose-800 text-rose-200 rounded-xl text-xs font-bold shadow transition-all whitespace-nowrap border border-rose-500/80 cursor-pointer';
        shootBtn.innerText = `⚡ HIT! 발사!`;
        shootBtn.className = 'px-3.5 py-1.5 bg-gradient-to-r from-amber-500 via-rose-500 to-red-600 hover:from-amber-400 hover:to-red-500 text-white rounded-xl text-xs font-black shadow-lg transition-all animate-pulse';
        msg.innerHTML = `<span class="text-yellow-300 font-bold">화면 탭으로 발사! (98~100% 크리티컬)</span>`;
      } else if (isAimDragging && selectedPiece) {
        shootBtn.disabled = true;
        cancelBtn.disabled = false;
        cancelBtn.className = 'px-2.5 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold shadow transition-all whitespace-nowrap border border-slate-600 cursor-pointer';
        shootBtn.innerText = `조준 중...`;
        shootBtn.className = 'px-3.5 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-black shadow';
        msg.innerHTML = `<span class="text-emerald-300 font-bold">[${selectedPiece.char}]</span> 방향 조준 후 손을 떼세요!`;
      } else {
        shootBtn.disabled = true;
        cancelBtn.disabled = true;
        cancelBtn.className = 'px-2.5 py-1.5 bg-slate-800 text-slate-600 rounded-xl text-xs font-bold shadow transition-all whitespace-nowrap border border-slate-700/50 cursor-not-allowed';
        shootBtn.innerText = '조준 대기';
        shootBtn.className = 'px-3.5 py-1.5 bg-slate-700 text-slate-400 rounded-xl text-xs font-black shadow cursor-not-allowed';
        msg.innerHTML = `<span class="text-amber-400 font-bold">1단계:</span> 내 기물을 터치하고 조준하세요.`;
      }
    }

    function deselectPiece() {
      selectedPiece = null;
      isAimDragging = false;
      isPowerBouncing = false;
      bouncePower = 0;
      updateBattleControlUI();
      document.getElementById('power-fill').style.width = '0%';
      document.getElementById('power-text').innerText = '0%';
    }

    function executeTimingShot() {
      if (!selectedPiece || !isPowerBouncing || isSimulating || isGameOver || currentTurn !== mySide) return;

      if (timerInterval) clearInterval(timerInterval);

      const finalPowerPct = Math.max(5, Math.round(bouncePower));
      isPowerBouncing = false;

      const isCritical = (finalPowerPct >= 98);
      const criticalMult = isCritical ? 1.4 : 1.0;

      let powerRatio = finalPowerPct / 100;
      let maxSpeed = 15.0;
      if (selectedPiece.ability === 'charge') maxSpeed = 18.0;
      if (selectedPiece.ability === 'hero_shock') maxSpeed = 20.0;

      const launchSpeed = Math.max(2.5, powerRatio * maxSpeed) * criticalMult;
      const vx = Math.cos(aimAngle) * launchSpeed;
      const vy = Math.sin(aimAngle) * launchSpeed;

      selectedPiece.vx = vx;
      selectedPiece.vy = vy;

      if (isCritical) {
        spawnShockwave(selectedPiece.x, selectedPiece.y, '#f59e0b', 180);
        spawnShockwave(selectedPiece.x, selectedPiece.y, '#ef4444', 120);
        visualEffects.push({ type: 'lightning', x: selectedPiece.x, y: selectedPiece.y, color: '#fef08a', life: 20 });
        spawnHitParticles(selectedPiece.x, selectedPiece.y, '#fbbf24', 30, 2.2);
        playCriticalShotSfx();
        playExplosionSfx(0.95);
        triggerShake(14);
      } else {
        if (selectedPiece.ability === 'cannon') {
          selectedPiece.isJumping = true;
          selectedPiece.jumpTime = 22;
          playJumpSfx();
        } else if (selectedPiece.ability === 'hero_shock') {
          playExplosionSfx(0.9);
          triggerShake(6);
        } else {
          playWoodClack(Math.min(1.0, 0.4 + launchSpeed * 0.04), selectedPiece.mass);
        }
      }

      if (selectedPiece.ability === 'curve') {
        selectedPiece.curveTimer = 25;
      }

      if (peerConn && peerConn.open) {
        peerConn.send({
          type: 'SHOOT',
          id: selectedPiece.id,
          vx: vx,
          vy: vy
        });
      }

      deselectPiece();
      isSimulating = true;
    }

    function spawnShockwave(x, y, color = '#fbbf24', maxR = 90) {
      shockwaves.push({ x, y, r: 4, maxR, color, alpha: 1.0 });
    }

    function spawnHitParticles(x, y, color, count = 10, speedMult = 1.0) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = (1.5 + Math.random() * 4.5) * speedMult;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          alpha: 1.0,
          color: color,
          size: 1.8 + Math.random() * 2.2
        });
      }
    }

    function triggerPieceSpecialEffect(p, hitX, hitY) {
      if (p.ability === 'hero_shock') {
        spawnShockwave(hitX, hitY, '#facc15', 150);
        spawnShockwave(hitX, hitY, '#38bdf8', 100);
        visualEffects.push({ type: 'lightning', x: hitX, y: hitY, color: '#fef08a', life: 16 });
        spawnHitParticles(hitX, hitY, '#fbbf24', 24, 1.6);
        triggerShake(10);
        playExplosionSfx(0.9);
      } else if (p.ability === 'shockwave') {
        spawnShockwave(hitX, hitY, '#10b981', 110);
        triggerShake(6);
        playExplosionSfx(0.65);
      } else if (p.ability === 'charge') {
        visualEffects.push({ type: 'lightning', x: hitX, y: hitY, color: '#38bdf8', life: 12 });
        spawnHitParticles(hitX, hitY, '#67e8f9', 18, 1.4);
        triggerShake(5);
        playWoodClack(0.95, p.mass);
      } else if (p.ability === 'cannon') {
        visualEffects.push({ type: 'explosion', x: hitX, y: hitY, r: 8, maxR: 45, color: '#a855f7', life: 14 });
        playExplosionSfx(0.8);
        triggerShake(6);
      } else if (p.ability === 'curve') {
        visualEffects.push({ type: 'vortex', x: hitX, y: hitY, angle: 0, life: 16 });
        spawnHitParticles(hitX, hitY, '#fb923c', 14);
      } else if (p.ability === 'shield') {
        visualEffects.push({ type: 'shield_barrier', x: hitX, y: hitY, r: p.radius * 2.5, life: 12 });
        playWoodClack(0.85, p.mass);
      } else {
        spawnHitParticles(hitX, hitY, '#cbd5e1', 12, 1.1);
        playWoodClack(0.5, p.mass);
      }
    }

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1)**2 + (y2 - y1)**2;
      if (l2 === 0) return { dist: Math.hypot(px - x1, py - y1), projX: x1, projY: y1 };
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * (x2 - x1);
      const projY = y1 + t * (y2 - y1);
      const dist = Math.hypot(px - projX, py - projY);
      return { dist, projX, projY };
    }

    function damageObstacle(target, piece, speed, isWall = false) {
      const dmg = Math.round((piece.mass * 0.42 + 0.8) * speed);
      target.hp -= dmg;
      
      const midX = isWall ? (target.x1 + target.x2) / 2 : target.x;
      const midY = isWall ? (target.y1 + target.y2) / 2 : target.y;

      spawnHitParticles(midX, midY, isWall ? target.color : '#f59e0b', 8, 1.2);
      triggerShake(Math.min(8, dmg * 0.08));

      if (target.hp <= 0) {
        spawnShockwave(midX, midY, isWall ? '#38bdf8' : '#ef4444', 90);
        spawnHitParticles(midX, midY, isWall ? '#bae6fd' : '#94a3b8', 25, 2.0);
        playExplosionSfx(0.7);
        triggerShake(9);
      }
    }

    function updatePhysics() {
      currentMap.obstacles.forEach(obs => {
        if (obs.type === 'sawblade' || obs.type === 'twin_blade') {
          obs.angle = (obs.angle + (obs.speed || 0.04)) % (Math.PI * 2);
        }
      });

      if (!isSimulating && gamePhase === 'battle') return;

      let stillMoving = false;

      pieces.forEach(p => {
        if (!p.alive) return;
        if (p.hitCooldown > 0) p.hitCooldown--;

        if (p.isJumping) {
          p.jumpTime--;
          if (p.jumpTime <= 0) {
            p.isJumping = false;
            spawnShockwave(p.x, p.y, '#c084fc', 50);
            playExplosionSfx(0.45);
            triggerShake(4);
          }
        }

        if (p.curveTimer > 0) {
          p.curveTimer--;
          p.vx += -p.vy * 0.045;
          p.vy += p.vx * 0.045;
        }

        p.x += p.vx;
        p.y += p.vy;

        const currentSpeed = Math.hypot(p.vx, p.vy);
        if (currentSpeed > 1.8 && !p.isJumping) {
          playSlideFriction(currentSpeed);
        }

        let currentFriction = 0.981;

        if (!p.isJumping) {
          for (let wi = currentMap.walls.length - 1; wi >= 0; wi--) {
            const w = currentMap.walls[wi];
            const { dist, projX, projY } = pointToSegmentDistance(p.x, p.y, w.x1, w.y1, w.x2, w.y2);
            if (dist < p.radius + 3) {
              const nx = (p.x - projX) / (dist || 1);
              const ny = (p.y - projY) / (dist || 1);
              p.x = projX + nx * (p.radius + 3);
              p.y = projY + ny * (p.radius + 3);

              const dot = p.vx * nx + p.vy * ny;
              p.vx = (p.vx - 2 * dot * nx) * 0.8;
              p.vy = (p.vy - 2 * dot * ny) * 0.8;

              playWoodClack(0.7, p.mass);
              const spd = Math.hypot(p.vx, p.vy);
              damageObstacle(w, p, spd, true);

              if (w.hp <= 0) {
                currentMap.walls.splice(wi, 1);
                continue;
              }
            }
          }

          for (let oi = currentMap.obstacles.length - 1; oi >= 0; oi--) {
            const obs = currentMap.obstacles[oi];
            const spd = Math.hypot(p.vx, p.vy);

            if (obs.type === 'mountain') {
              const dist = Math.hypot(p.x - obs.x, p.y - obs.y);
              if (dist < obs.r + p.radius) {
                const nx = (p.x - obs.x) / dist;
                const ny = (p.y - obs.y) / dist;
                p.x = obs.x + nx * (obs.r + p.radius);
                p.y = obs.y + ny * (obs.r + p.radius);
                const dot = p.vx * nx + p.vy * ny;
                p.vx = (p.vx - 2 * dot * nx) * 0.72;
                p.vy = (p.vy - 2 * dot * ny) * 0.72;

                damageObstacle(obs, p, spd);
                if (obs.hp <= 0) {
                  currentMap.obstacles.splice(oi, 1);
                  continue;
                }
              }
            } else if (obs.type === 'water_puddle') {
              if (Math.hypot(p.x - obs.x, p.y - obs.y) < obs.r + p.radius) {
                currentFriction = 0.995;
                p.vx += (Math.random() - 0.5) * 0.15;
                damageObstacle(obs, p, spd * 0.5);
                if (obs.hp <= 0) {
                  currentMap.obstacles.splice(oi, 1);
                  continue;
                }
              }
            } else if (obs.type === 'mud') {
              if (Math.hypot(p.x - obs.x, p.y - obs.y) < obs.r + p.radius) {
                currentFriction = 0.90;
                damageObstacle(obs, p, spd * 0.7);
                if (obs.hp <= 0) {
                  currentMap.obstacles.splice(oi, 1);
                  continue;
                }
              }
            } else if (obs.type === 'sawblade') {
              const dist = Math.hypot(p.x - obs.x, p.y - obs.y);
              if (dist < obs.r + p.radius) {
                const nx = (p.x - obs.x) / dist;
                const ny = (p.y - obs.y) / dist;
                p.vx = nx * 6.5;
                p.vy = ny * 6.5;
                if (p.shield > 0) p.shield--;
                damageObstacle(obs, p, spd);
                if (obs.hp <= 0) {
                  currentMap.obstacles.splice(oi, 1);
                  continue;
                }
              }
            } else if (obs.type === 'twin_blade') {
              const x2 = obs.x + Math.cos(obs.angle) * obs.len;
              const y2 = obs.y + Math.sin(obs.angle) * obs.len;
              const x1 = obs.x - Math.cos(obs.angle) * obs.len;
              const y1 = obs.y - Math.sin(obs.angle) * obs.len;

              const { dist, projX, projY } = pointToSegmentDistance(p.x, p.y, x1, y1, x2, y2);
              if (dist < p.radius + 4) {
                const pushAngle = obs.angle + Math.PI / 2;
                p.vx += Math.cos(pushAngle) * 6.0;
                p.vy += Math.sin(pushAngle) * 6.0;
                damageObstacle(obs, p, spd);
                if (obs.hp <= 0) {
                  currentMap.obstacles.splice(oi, 1);
                  continue;
                }
              }
            }
          }
        }

        p.vx *= currentFriction;
        p.vy *= currentFriction;

        if (Math.hypot(p.vx, p.vy) > 0.12) {
          stillMoving = true;
          if (Math.random() < 0.2) spawnHitParticles(p.x, p.y, p.border, 1);
        } else {
          p.vx = 0; p.vy = 0;
        }

        if (p.x < boardBounds.left || p.x > boardBounds.right || p.y < boardBounds.top || p.y > boardBounds.bottom) {
          if (p.shield > 0) {
            p.shield--;
            p.x = Math.max(boardBounds.left + p.radius + 2, Math.min(boardBounds.right - p.radius - 2, p.x));
            p.y = Math.max(boardBounds.top + p.radius + 2, Math.min(boardBounds.bottom - p.radius - 2, p.y));
            p.vx = -p.vx * 0.65;
            p.vy = -p.vy * 0.65;
            playBarrierSaveSfx();
            spawnShockwave(p.x, p.y, '#38bdf8', 85);
            triggerShake(6);
          } else {
            p.alive = false;
            p.vx = 0; p.vy = 0;
            playFallSfx();
            spawnShockwave(p.x, p.y, '#ef4444', 45);
            triggerShake(4);
            updateUI();
          }
        }
      });

      for (let i = 0; i < pieces.length; i++) {
        for (let j = i + 1; j < pieces.length; j++) {
          const p1 = pieces[i];
          const p2 = pieces[j];
          if (!p1.alive || !p2.alive) continue;
          if (p1.isJumping || p2.isJumping) continue;

          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.hypot(dx, dy);

          if (dist < p1.radius + p2.radius) {
            const relSpd = Math.hypot(p1.vx - p2.vx, p1.vy - p2.vy);
            const hitX = (p1.x + p2.x) / 2;
            const hitY = (p1.y + p2.y) / 2;

            if (relSpd > 0.8 && p1.hitCooldown === 0 && p2.hitCooldown === 0) {
              triggerPieceSpecialEffect(p1, hitX, hitY);
              triggerPieceSpecialEffect(p2, hitX, hitY);
              playWoodClack(relSpd * 0.14, Math.max(p1.mass, p2.mass));
              p1.hitCooldown = 6;
              p2.hitCooldown = 6;
            }

            if ((p1.ability === 'hero_shock' || p2.ability === 'hero_shock') && relSpd > 3.5) {
              pieces.forEach(target => {
                if (target !== p1 && target !== p2 && target.alive && !target.isJumping) {
                  const td = Math.hypot(target.x - hitX, target.y - hitY);
                  if (td < 140) {
                    const ang = Math.atan2(target.y - hitY, target.x - hitX);
                    target.vx += Math.cos(ang) * 4.2;
                    target.vy += Math.sin(ang) * 4.2;
                  }
                }
              });
            } else if ((p1.ability === 'shockwave' || p2.ability === 'shockwave') && relSpd > 4.5) {
              pieces.forEach(target => {
                if (target !== p1 && target !== p2 && target.alive && !target.isJumping) {
                  const td = Math.hypot(target.x - hitX, target.y - hitY);
                  if (td < 100) {
                    const ang = Math.atan2(target.y - hitY, target.x - hitX);
                    target.vx += Math.cos(ang) * 3.0;
                    target.vy += Math.sin(ang) * 3.0;
                  }
                }
              });
            }

            const angle = Math.atan2(dy, dx);
            const sin = Math.sin(angle);
            const cos = Math.cos(angle);

            const overlap = (p1.radius + p2.radius - dist) / 2;
            p1.x -= cos * (overlap + 0.5);
            p1.y -= sin * (overlap + 0.5);
            p2.x += cos * (overlap + 0.5);
            p2.y += sin * (overlap + 0.5);

            const vx1 = p1.vx * cos + p1.vy * sin;
            const vy1 = p1.vy * cos - p1.vx * sin;
            const vx2 = p2.vx * cos + p2.vy * sin;
            const vy2 = p2.vy * cos - p2.vx * sin;

            const m1 = p1.mass;
            const m2 = p2.mass;
            const vx1F = ((m1 - m2) * vx1 + 2 * m2 * vx2) / (m1 + m2);
            const vx2F = ((m2 - m1) * vx2 + 2 * m1 * vx1) / (m1 + m2);

            p1.vx = vx1F * cos - vy1 * sin;
            p1.vy = vy1 * cos + vx1F * sin;
            p2.vx = vx2F * cos - vy2 * sin;
            p2.vy = vy2 * cos + vx2F * sin;
          }
        }
      }

      if (!stillMoving && isSimulating) {
        isSimulating = false;
        currentTurn = (currentTurn === 'cho') ? 'han' : 'cho';
        onTurnSwitched();
      }
    }

    function onTurnSwitched() {
      if (isGameOver) return;
      const badge = document.getElementById('game-phase-badge');

      if (currentTurn === mySide) {
        badge.innerText = `${mySide === 'cho' ? '초(내 턴)' : '한(내 턴)'}`;
        badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs font-black bg-emerald-600 text-white shadow animate-pulse';
        updateBattleControlUI();
      } else {
        badge.innerText = '상대 턴 진행 중...';
        badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs font-black bg-red-600 text-white shadow animate-pulse';
        deselectPiece();

        if (isAIMode && currentTurn === 'han') {
          setTimeout(triggerAIMove, 700);
        }
      }
      startTimer(20);
    }

    function triggerAIMove() {
      if (isGameOver || gamePhase !== 'battle') return;
      const hanList = pieces.filter(p => p.side === 'han' && p.alive);
      const choList = pieces.filter(p => p.side === 'cho' && p.alive);
      if (hanList.length === 0 || choList.length === 0) return;

      const shooter = hanList[Math.floor(Math.random() * hanList.length)];
      let target = choList[0];
      let minD = 9999;
      choList.forEach(c => {
        const d = Math.hypot(c.x - shooter.x, c.y - shooter.y);
        if (d < minD) { minD = d; target = c; }
      });

      const angle = Math.atan2(target.y - shooter.y, target.x - shooter.x) + (Math.random() - 0.5) * 0.12;
      const power = (shooter.ability === 'hero_shock') ? (14 + Math.random() * 5) : (10 + Math.random() * 4);
      shooter.vx = Math.cos(angle) * power;
      shooter.vy = Math.sin(angle) * power;

      if (shooter.ability === 'cannon') {
        shooter.isJumping = true;
        shooter.jumpTime = 22;
        playJumpSfx();
      } else if (shooter.ability === 'hero_shock') {
        playExplosionSfx(0.9);
        triggerShake(5);
      } else {
        playWoodClack(0.85, shooter.mass);
      }
      if (timerInterval) clearInterval(timerInterval);
      isSimulating = true;
    }

    /* 렌더링 루프 - 배치 단계 알 표시 버그 완벽 수정 */
    function render(timestamp) {
      if (isPowerBouncing && selectedPiece && gamePhase === 'battle') {
        const delta = (timestamp - lastBounceTime) / 1000;
        bouncePower += bounceDirection * bounceSpeed * delta;
        if (bouncePower >= 100) {
          bouncePower = 100;
          bounceDirection = -1;
        } else if (bouncePower <= 0) {
          bouncePower = 0;
          bounceDirection = 1;
        }
        document.getElementById('power-fill').style.width = `${Math.round(bouncePower)}%`;
        
        const isCrit = (bouncePower >= 98);
        document.getElementById('power-text').innerHTML = isCrit 
          ? `<span class="text-yellow-300 font-black animate-ping">CRITICAL! 100%</span>` 
          : `${Math.round(bouncePower)}%`;
      }
      lastBounceTime = timestamp;

      const w = parseFloat(canvas.style.width);
      const h = parseFloat(canvas.style.height);
      if (!w || !h) return;
      ctx.clearRect(0, 0, w, h);

      ctx.save();
      if (shakeIntensity > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
        shakeIntensity *= 0.88;
        if (shakeIntensity < 0.2) shakeIntensity = 0;
      }

      ctx.fillStyle = currentMap.bg;
      ctx.fillRect(boardBounds.left, boardBounds.top, boardBounds.width, boardBounds.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 14; i++) {
        const x = boardBounds.left + (boardBounds.width / 14) * i;
        ctx.beginPath(); ctx.moveTo(x, boardBounds.top); ctx.lineTo(x, boardBounds.bottom); ctx.stroke();
      }
      for (let i = 0; i <= 10; i++) {
        const y = boardBounds.top + (boardBounds.height / 10) * i;
        ctx.beginPath(); ctx.moveTo(boardBounds.left, y); ctx.lineTo(boardBounds.right, y); ctx.stroke();
      }

      currentMap.walls.forEach(w => {
        ctx.save();
        ctx.strokeStyle = w.color;
        ctx.lineWidth = 4.5;
        ctx.shadowColor = w.color;
        ctx.shadowBlur = 8;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
        ctx.restore();

        if (w.hp !== undefined && w.maxHp) {
          const midX = (w.x1 + w.x2) / 2;
          const midY = (w.y1 + w.y2) / 2;
          const barW = Math.max(18, Math.hypot(w.x2 - w.x1, w.y2 - w.y1) * 0.4);
          const barH = 3;
          const barX = midX - barW / 2;
          const barY = midY - 7;
          const hpRatio = Math.max(0, w.hp / w.maxHp);

          ctx.save();
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fillRect(barX, barY, barW, barH);
          ctx.fillStyle = hpRatio > 0.5 ? '#38bdf8' : (hpRatio > 0.25 ? '#f59e0b' : '#ef4444');
          ctx.fillRect(barX, barY, barW * hpRatio, barH);
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 0.8;
          ctx.strokeRect(barX, barY, barW, barH);
          ctx.restore();
        }
      });

      currentMap.obstacles.forEach(obs => {
        ctx.save();
        if (obs.type === 'mountain') {
          ctx.translate(obs.x, obs.y);
          ctx.fillStyle = '#334155';
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 2;
          ctx.beginPath();
          obs.points.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else if (obs.type === 'water_puddle') {
          ctx.fillStyle = 'rgba(2, 132, 199, 0.35)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(obs.x, obs.y, obs.rx, obs.ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (obs.type === 'mud') {
          ctx.fillStyle = 'rgba(120, 53, 15, 0.45)';
          ctx.strokeStyle = '#92400e';
          ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#b45309';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('진흙', obs.x, obs.y + 3);
        } else if (obs.type === 'sawblade') {
          ctx.translate(obs.x, obs.y);
          ctx.rotate(obs.angle);
          ctx.fillStyle = '#475569';
          ctx.strokeStyle = '#f87171';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, obs.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#dc2626';
          for (let s = 0; s < 8; s++) {
            ctx.rotate(Math.PI / 4);
            ctx.beginPath();
            ctx.moveTo(obs.r, -3);
            ctx.lineTo(obs.r + 5, 0);
            ctx.lineTo(obs.r, 3);
            ctx.fill();
          }
        } else if (obs.type === 'twin_blade') {
          ctx.translate(obs.x, obs.y);
          ctx.rotate(obs.angle);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-obs.len, -2.5, obs.len * 2, 5);
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();

        if (obs.hp !== undefined && obs.maxHp) {
          const barW = Math.max(22, (obs.boundR || obs.r || 20) * 1.5);
          const barH = 3.5;
          const barX = obs.x - barW / 2;
          const barY = obs.y - (obs.boundR || obs.r || 20) - 8;
          const hpRatio = Math.max(0, obs.hp / obs.maxHp);

          ctx.save();
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fillRect(barX, barY, barW, barH);
          ctx.fillStyle = hpRatio > 0.5 ? '#10b981' : (hpRatio > 0.25 ? '#f59e0b' : '#ef4444');
          ctx.fillRect(barX, barY, barW * hpRatio, barH);
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 0.8;
          ctx.strokeRect(barX, barY, barW, barH);
          ctx.restore();
        }
      });

      if (gamePhase === 'placement') {
        ctx.save();
        ctx.fillStyle = mySide === 'cho' ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)';
        ctx.strokeStyle = mySide === 'cho' ? '#10b981' : '#ef4444';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(boardBounds.left, mySpawnZone.top, boardBounds.width, mySpawnZone.bottom - mySpawnZone.top);
        ctx.fillRect(boardBounds.left, mySpawnZone.top, boardBounds.width, mySpawnZone.bottom - mySpawnZone.top);
        ctx.fillStyle = mySide === 'cho' ? '#34d399' : '#f87171';
        ctx.font = 'bold 10px "Jua"';
        ctx.fillText(`내 진영 배치 구역 (${mySide === 'cho' ? '초군' : '한군'})`, boardBounds.left + 8, mySpawnZone.top + 14);
        ctx.restore();

        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
        ctx.fillRect(boardBounds.left, oppSpawnZone.top, boardBounds.width, oppSpawnZone.bottom - oppSpawnZone.top);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(boardBounds.left, oppSpawnZone.top, boardBounds.width, oppSpawnZone.bottom - oppSpawnZone.top);
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 11px "Jua"';
        ctx.textAlign = 'center';
        ctx.fillText('🌫️ 상대방 진영 (비공개 배치) 🌫️️', boardBounds.left + boardBounds.width / 2, oppSpawnZone.top + (oppSpawnZone.bottom - oppSpawnZone.top) / 2);
        ctx.restore();
      }

      ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(boardBounds.left, boardBounds.top, boardBounds.width, boardBounds.height);

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        ctx.save();
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = sw.alpha;
        ctx.lineWidth = 3.5 * sw.alpha;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        sw.r += 4.5;
        sw.alpha -= 0.045;
        if (sw.alpha <= 0 || sw.r >= sw.maxR) shockwaves.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= 0.038;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }

      /* [기물 렌더링] 배치 단계에서 내 기물이 무조건 그려지도록 조건 명확화 */
      pieces.forEach(p => {
        if (!p.alive) return;
        if (gamePhase === 'placement') {
          // 배치 단계에서는 오직 본인 사이드의 기물만 렌더링 (상대방은 비공개)
          if (p.side !== mySide) return;
        }

        const isCho = (p.side === 'cho');

        ctx.save();
        ctx.translate(p.x, p.y);

        const scale = p.isJumping ? 1.35 : 1.0;
        ctx.scale(scale, scale);

        if (selectedPiece === p) {
          ctx.save();
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3.5;
          ctx.shadowColor = '#fbbf24';
          ctx.shadowBlur = 12;
          ctx.beginPath(); ctx.arc(0, 0, p.radius + 5, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }

        if (p.shield > 0) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.arc(0, 0, p.radius + 4, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
        }

        if (p.heroKey && loadedImages[p.heroKey] && loadedImages[p.heroKey].complete) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
          ctx.clip();

          const img = loadedImages[p.heroKey];
          ctx.drawImage(img, -p.radius, -p.radius, p.radius * 2, p.radius * 2);
          ctx.restore();

          ctx.save();
          ctx.lineWidth = p.ringWidth || 5;
          ctx.strokeStyle = '#facc15';
          ctx.shadowColor = '#eab308';
          ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();

          ctx.fillStyle = '#fef08a';
          ctx.font = `900 ${p.radius * 0.45}px 'Jua'`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.shadowColor = '#000000';
          ctx.shadowBlur = 4;
          ctx.fillText(p.char, 0, p.radius - 1);
        } else {
          const grad = ctx.createRadialGradient(-p.radius * 0.3, -p.radius * 0.3, p.radius * 0.1, 0, 0, p.radius);
          if (isCho) {
            grad.addColorStop(0, '#059669');
            grad.addColorStop(1, '#064e3b');
          } else {
            grad.addColorStop(0, '#dc2626');
            grad.addColorStop(1, '#7f1d1d');
          }

          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill();

          ctx.lineWidth = p.ringWidth || 2.5;
          ctx.strokeStyle = p.border;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = `900 ${p.radius * 1.15}px 'Jua'`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.char, 0, 1.2);
        }

        ctx.restore();
      });

      if (selectedPiece && gamePhase === 'battle' && !isSimulating) {
        ctx.save();

        const curPower = isPowerBouncing ? Math.max(10, bouncePower) : 60;
        const isCritAim = isPowerBouncing && (curPower >= 98);
        const pRatio = curPower / 100;
        let maxSpd = 15.0;
        if (selectedPiece.ability === 'charge') maxSpd = 18.0;
        if (selectedPiece.ability === 'hero_shock') maxSpd = 20.0;
        const launchSpeed = Math.max(2.5, pRatio * maxSpd) * (isCritAim ? 1.4 : 1.0);

        ctx.strokeStyle = isCritAim ? '#fbbf24' : (isPowerBouncing ? '#ef4444' : selectedPiece.border);
        ctx.fillStyle = isCritAim ? '#fbbf24' : (isPowerBouncing ? '#ef4444' : selectedPiece.border);
        ctx.lineWidth = isCritAim ? 4.5 : (isPowerBouncing ? 3.5 : 2.5);
        ctx.setLineDash(isCritAim ? [3, 2] : [5, 4]);

        let simX = selectedPiece.x;
        let simY = selectedPiece.y;
        let simVx = Math.cos(aimAngle) * launchSpeed;
        let simVy = Math.sin(aimAngle) * launchSpeed;

        ctx.beginPath();
        ctx.moveTo(simX, simY);

        const steps = 11;
        for (let step = 1; step <= steps; step++) {
          if (selectedPiece.ability === 'curve') {
            simVx += -simVy * 0.045;
            simVy += simVx * 0.045;
          }
          simX += simVx;
          simY += simVy;
          ctx.lineTo(simX, simY);
        }
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(simX, simY, isCritAim ? 7 : (isPowerBouncing ? 6 : 4.5), 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();

      updatePhysics();
      requestAnimationFrame(render);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupNickname();
      resizeCanvas();
      generateRandomMap();
      initP2P();
      updateUI();
      requestAnimationFrame(render);
    });
  </script>
</body>
