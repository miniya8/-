  <script>
    const canvas = document.getElementById('alkkagiCanvas');
    const ctx = canvas.getContext('2d');

    // 리얼 장기판 사운드 엔진 (원목 타건 & 미끄러짐 마찰 합성)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let lastClackTime = 0;
    let lastSlideTime = 0;

    // 리얼 원목 장기알 타격음 (고역대 타격 + 장기판 내부 목재 공명 듀얼 레이어)
    function playWoodClack(intensity = 0.5, massRatio = 1.0) {
      const now = performance.now();
      if (now - lastClackTime < 38) return;
      lastClackTime = now;

      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const vol = Math.min(1.0, Math.max(0.12, intensity));

        // 1. 단단한 박달나무 접촉 어택 노이즈 ('딱!' 하는 순간 임팩트)
        const bufferSize = audioCtx.sampleRate * 0.028;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.16));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        // 질량이 클수록 깊은 목재음, 가벼울수록 경쾌한 맑은 목재음
        const centerFreq = Math.max(900, 1800 - massRatio * 150);
        noiseFilter.frequency.setValueAtTime(centerFreq, t);
        noiseFilter.Q.setValueAtTime(3.8, t);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(vol * 0.9, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.028);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(t);

        // 2. 장기판 두꺼운 나무 몸통 통울림 공명 (피치 강하 감쇠)
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        const startPitch = Math.max(180, 480 - massRatio * 40);
        const endPitch = Math.max(50, 110 - massRatio * 10);
        osc.frequency.setValueAtTime(startPitch, t);
        osc.frequency.exponentialRampToValueAtTime(endPitch, t + 0.075);

        oscGain.gain.setValueAtTime(vol * 0.75, t);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.075);

        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      } catch(e) {}
    }

    // 장기알이 전장 판 위를 미끄러질 때 나는 매끄러운 목재 마찰음
    function playSlideFriction(speed) {
      if (speed < 1.8) return;
      const now = performance.now();
      if (now - lastSlideTime < 90) return;
      lastSlideTime = now;

      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const dur = 0.06;
        const bufferSize = audioCtx.sampleRate * dur;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.25;
        }
        const slideNoise = audioCtx.createBufferSource();
        slideNoise.buffer = buffer;

        const slideFilter = audioCtx.createBiquadFilter();
        slideFilter.type = 'lowpass';
        slideFilter.frequency.setValueAtTime(650, t);

        const slideGain = audioCtx.createGain();
        const vol = Math.min(0.25, (speed / 20) * 0.2);
        slideGain.gain.setValueAtTime(vol, t);
        slideGain.gain.linearRampToValueAtTime(0.001, t + dur);

        slideNoise.connect(slideFilter);
        slideFilter.connect(slideGain);
        slideGain.connect(audioCtx.destination);
        slideNoise.start(t);
      } catch(e) {}
    }

    function playSlashDamageSfx() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(900, t);
        osc.frequency.exponentialRampToValueAtTime(120, t + 0.15);
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      } catch(e) {}
    }

    function playExplosionSfx(vol = 0.6) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.3);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.32);
      } catch(e) {}
    }

    function playJumpSfx() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.18);
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      } catch(e) {}
    }

    function playFallSfx() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, t);
        osc.frequency.linearRampToValueAtTime(45, t + 0.3);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.33);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.33);
      } catch(e) {}
    }

    function playBarrierSaveSfx() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, t);
        osc.frequency.linearRampToValueAtTime(950, t + 0.25);
        gain.gain.setValueAtTime(0.6, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.28);
      } catch(e) {}
    }

    const PIECE_CONFIG = {
      '楚': { name: '장군', cost: 6, radiusRatio: 0.029, mass: 5.5, border: '#34d399', ability: 'shockwave', shield: 2 },
      '漢': { name: '장군', cost: 6, radiusRatio: 0.029, mass: 5.5, border: '#f87171', ability: 'shockwave', shield: 2 },
      '車': { name: '차',   cost: 5, radiusRatio: 0.025, mass: 3.8, border: '#67e8f9', ability: 'charge', shield: 1 },
      '包': { name: '포',   cost: 4, radiusRatio: 0.023, mass: 2.8, border: '#d8b4fe', ability: 'cannon', shield: 1 },
      '馬': { name: '마',   cost: 3, radiusRatio: 0.022, mass: 2.3, border: '#fb923c', ability: 'curve', shield: 1 },
      '象': { name: '상',   cost: 2, radiusRatio: 0.025, mass: 4.2, border: '#facc15', ability: 'shield', shield: 1 },
      '卒': { name: '졸/병',cost: 1, radiusRatio: 0.019, mass: 1.0, border: '#e2e8f0', ability: 'nimble', shield: 0 }
    };

    let mySide = 'cho';
    let isAIMode = false;
    let peer = null;
    let peerConn = null;
    let isHost = true;
    let isPeerReady = false;
    let isMyReady = false;

    let gamePhase = 'placement';
    let budget = 20;
    let pieces = [];

    let shockwaves = [];

    let timerTotal = 40;
    let timerRemaining = 40;

    let shakeIntensity = 0;
    function triggerShake(val) {
      shakeIntensity = Math.min(18, shakeIntensity + val);
    }

    let currentTurn = 'cho';
    let isDragging = false;
    let selectedPiece = null;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };
    let isSimulating = false;
    let isGameOver = false;

    let boardBounds = { left: 0, top: 0, right: 0, bottom: 0, width: 0, height: 0 };
    let mySpawnZone = { top: 0, bottom: 0 };

    function setupNickname() {
      let nick = localStorage.getItem('jg_permanent_nickname');
      if (!nick) {
        nick = '신궁알까기_' + Math.floor(100 + Math.random() * 900);
        localStorage.setItem('jg_permanent_nickname', nick);
      }
      document.getElementById('my-name').innerText = nick;
    }

    function resizeCanvas() {
      const container = document.getElementById('board-container');
      const w = container.clientWidth - 8;
      const h = container.clientHeight - 8;
      canvas.width = w * window.devicePixelRatio;
      canvas.height = h * window.devicePixelRatio;
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      ctx.resetTransform();
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      boardBounds = {
        left: w * 0.03,
        top: h * 0.03,
        right: w * 0.97,
        bottom: h * 0.97,
        width: w * 0.94,
        height: h * 0.94
      };

      if (mySide === 'cho') {
        mySpawnZone = { top: boardBounds.top + boardBounds.height * 0.73, bottom: boardBounds.bottom };
        oppSpawnZone = { top: boardBounds.top, bottom: boardBounds.top + boardBounds.height * 0.27 };
      } else {
        mySpawnZone = { top: boardBounds.top, bottom: boardBounds.top + boardBounds.height * 0.27 };
        oppSpawnZone = { top: boardBounds.top + boardBounds.height * 0.73, bottom: boardBounds.bottom };
      }
    }
    window.addEventListener('resize', () => {
      resizeCanvas();
      generateRandomMap();
    });

    function generateRandomMap() {
      const w = boardBounds.width;
      const h = boardBounds.height;
      const bx = boardBounds.left;
      const by = boardBounds.top;

      currentMap.walls = [];
      currentMap.obstacles = [];

      const midY = by + h * 0.5;
      const segW = w / 5;
      currentMap.walls.push({ x1: bx, y1: midY, x2: bx + segW * 1.35, y2: midY, color: '#38bdf8' });
      currentMap.walls.push({ x1: bx + segW * 1.85, y1: midY, x2: bx + segW * 3.15, y2: midY, color: '#38bdf8' });
      currentMap.walls.push({ x1: bx + segW * 3.65, y1: midY, x2: bx + w, y2: midY, color: '#38bdf8' });

      currentMap.walls.push({ x1: bx, y1: by + h * 0.25, x2: bx, y2: by + h * 0.35, color: '#94a3b8' });
      currentMap.walls.push({ x1: bx + w, y1: by + h * 0.25, x2: bx + w, y2: by + h * 0.35, color: '#94a3b8' });
      currentMap.walls.push({ x1: bx, y1: by + h * 0.65, x2: bx, y2: by + h * 0.75, color: '#94a3b8' });
      currentMap.walls.push({ x1: bx + w, y1: by + h * 0.65, x2: bx + w, y2: by + h * 0.75, color: '#94a3b8' });

      const obstacleCount = 5 + Math.floor(Math.random() * 3);
      const types = ['mountain', 'water_puddle', 'sawblade', 'twin_blade', 'mud'];

      for (let i = 0; i < obstacleCount; i++) {
        const obsType = types[Math.floor(Math.random() * types.length)];
        const ox = bx + w * (0.15 + Math.random() * 0.7);
        const oy = (Math.random() > 0.5) 
          ? by + h * (0.33 + Math.random() * 0.13) 
          : by + h * (0.55 + Math.random() * 0.13);

        if (obsType === 'mountain') {
          const r = w * (0.026 + Math.random() * 0.012);
          const points = [];
          const numPts = 7;
          for (let p = 0; p < numPts; p++) {
            const ang = (Math.PI * 2 / numPts) * p;
            const dist = r * (0.75 + Math.random() * 0.45);
            points.push({ x: Math.cos(ang) * dist, y: Math.sin(ang) * dist });
          }
          currentMap.obstacles.push({ type: 'mountain', x: ox, y: oy, r, points });
        } else if (obsType === 'water_puddle') {
          const rx = w * (0.05 + Math.random() * 0.02);
          const ry = h * (0.04 + Math.random() * 0.015);
          currentMap.obstacles.push({ type: 'water_puddle', x: ox, y: oy, rx, ry, r: (rx+ry)/2, waveTimer: 0 });
        } else if (obsType === 'sawblade') {
          currentMap.obstacles.push({
            type: 'sawblade',
            x: ox, y: oy,
            r: w * 0.026,
            angle: 0,
            speed: (Math.random() > 0.5 ? 1 : -1) * 0.06
          });
        } else if (obsType === 'twin_blade') {
          currentMap.obstacles.push({
            type: 'twin_blade',
            x: ox, y: oy,
            len: w * (0.05 + Math.random() * 0.02),
            angle: Math.random() * Math.PI,
            speed: (Math.random() > 0.5 ? 1 : -1) * 0.03
          });
        } else if (obsType === 'mud') {
          currentMap.obstacles.push({ type: 'mud', x: ox, y: oy, r: w * (0.045 + Math.random() * 0.02) });
        }
      }
    }

    let my4DigitCode = '';
    function initP2P() {
      my4DigitCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('my-room-code').innerText = my4DigitCode;

      const peerId = 'alkkagi_2026_' + my4DigitCode;
      peer = new Peer(peerId);

      peer.on('connection', conn => {
        peerConn = conn;
        isHost = true;
        mySide = 'cho';
        setupConnectionEvents();
        document.getElementById('host-wait-msg').innerText = '상대방이 입장했습니다! 배치를 시작하세요.';
        document.getElementById('multi-lobby-modal').classList.add('hidden');
        startTimer(40);
      });
    }

    function copyRoomCode() {
      navigator.clipboard.writeText(my4DigitCode);
      alert(`방 번호 [${my4DigitCode}] 가 복사되었습니다! 친구에게 전달하세요.`);
    }

    function connectWith4Digit() {
      const code = document.getElementById('join-room-code').value.trim();
      if (!code || code.length !== 4) {
        alert('올바른 4자리 숫자를 입력해주세요!');
        return;
      }
      const targetPeerId = 'alkkagi_2026_' + code;
      peerConn = peer.connect(targetPeerId);
      isHost = false;
      mySide = 'han';
      setupConnectionEvents();
      document.getElementById('multi-lobby-modal').classList.add('hidden');
      startTimer(40);
    }

    function setupConnectionEvents() {
      peerConn.on('open', () => {
        peerConn.send({
          type: 'HANDSHAKE',
          nickname: localStorage.getItem('jg_permanent_nickname') || '도전자',
          map: isHost ? currentMap : null
        });
      });

      peerConn.on('data', data => {
        if (data.type === 'HANDSHAKE') {
          document.getElementById('opp-name').innerText = data.nickname;
          if (!isHost && data.map) currentMap = data.map;
        } else if (data.type === 'READY_SYNC') {
          isPeerReady = true;
          const oppPieces = data.pieces.map(p => ({
            ...p,
            alive: true,
            vx: 0, vy: 0,
            hitCooldown: 0
          }));
          pieces = pieces.filter(p => p.side === mySide).concat(oppPieces);
          checkStartBattle();
        } else if (data.type === 'SHOOT') {
          const shooter = pieces.find(p => p.id === data.id);
          if (shooter) {
            shooter.vx = data.vx;
            shooter.vy = data.vy;
            if (shooter.ability === 'cannon') {
              shooter.isJumping = true;
              shooter.jumpTime = 22;
              playJumpSfx();
            } else {
              playWoodClack(0.85, shooter.mass);
            }
            isSimulating = true;
          }
        } else if (data.type === 'TIMEOUT_PASS') {
          forceTurnPass();
        } else if (data.type === 'REMATCH_REQUEST') {
          handleInstantRematch(data.map);
        }
      });
    }

    function requestInstantRematch() {
      document.getElementById('game-over-modal').classList.add('hidden');
      generateRandomMap();

      if (peerConn && peerConn.open) {
        peerConn.send({
          type: 'REMATCH_REQUEST',
          map: currentMap
        });
      }
      handleInstantRematch(currentMap);
    }

    function handleInstantRematch(newMap) {
      document.getElementById('game-over-modal').classList.add('hidden');
      if (newMap) currentMap = newMap;
      
      isGameOver = false;
      isSimulating = false;
      isMyReady = false;
      isPeerReady = false;
      gamePhase = 'placement';
      budget = 20;
      pieces = [];
      particles = [];
      shockwaves = [];
      visualEffects = [];

      document.getElementById('placement-panel').classList.remove('hidden');
      document.getElementById('battle-panel').classList.add('hidden');
      document.getElementById('ready-btn').innerText = '배치 완료 & 준비 ⚔️';
      document.getElementById('ready-btn').className = 'px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-black shadow transition-all';

      const badge = document.getElementById('game-phase-badge');
      badge.innerText = '비공개 배치';

    function startSoloAIMode() {
      isAIMode = true;

      document.getElementById('opp-name').innerText = '인공지능 (COM)';
      setupAIHanArmy();
      updateUI();

    }

    function startTimer(duration) {
      clearInterval(timerInterval);
      timerTotal = duration;
      timerRemaining = duration;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timerRemaining--;
        updateTimerDisplay();

        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const tb = document.getElementById('timer-badge');
      const tp = document.getElementById('timer-progress');
      tb.innerText = `${timerRemaining}초`;
      const ratio = Math.max(0, timerRemaining / timerTotal);
      tp.style.width = `${ratio * 100}%`;

      if (ratio < 0.25) {
        tp.className = 'bg-rose-500 h-full transition-all duration-300';
      } else {
        tp.className = 'bg-gradient-to-r from-emerald-500 to-amber-500 h-full transition-all duration-300';
      }
    }

    function handleTimeOut() {
      if (gamePhase === 'placement') {
        if (!isMyReady) toggleReady();
      } else if (gamePhase === 'battle') {
        if (currentTurn === mySide) {
          if (peerConn && peerConn.open) {
            peerConn.send({ type: 'TIMEOUT_PASS' });
          }
          forceTurnPass();
        }
      }
    }

    function forceTurnPass() {
      if (isSimulating) return;
      currentTurn = (currentTurn === 'cho') ? 'han' : 'cho';
      onTurnSwitched();
    }

    // [신규] 20점 풀 활용 스마트 자동 추천 배치 기능
    function autoBalancedDeploy() {
      if (gamePhase !== 'placement') return;

      // 기존 내 말 초기화 및 20점 풀 복구
      pieces = pieces.filter(p => p.side !== mySide);
      budget = 20;

      // 추천 밸런스 덱: 장군(6) + 차(5) + 포(4) + 마(3) + 상(2) = 20점 완벽 소진
      const deployRoster = ['楚', '車', '包', '馬', '象'];

      // 전략적 포메이션 좌표 계산 (전방: 상 / 중열: 차, 마 / 후방: 장군, 포)
      const bW = boardBounds.width;
      const bLeft = boardBounds.left;
      const zTop = mySpawnZone.top;
      const zBottom = mySpawnZone.bottom;
      const zH = zBottom - zTop;

      const formation = [
        { type: '楚', x: bLeft + bW * 0.50, y: zTop + zH * 0.80 }, // 후방 사령관
        { type: '車', x: bLeft + bW * 0.18, y: zTop + zH * 0.45 }, // 좌측 돌파
        { type: '包', x: bLeft + bW * 0.82, y: zTop + zH * 0.75 }, // 우측 후방 포격
        { type: '馬', x: bLeft + bW * 0.75, y: zTop + zH * 0.45 }, // 우측 스윙
        { type: '象', x: bLeft + bW * 0.50, y: zTop + zH * 0.28 }  // 전방 중앙 탱커
      ];

      formation.forEach(item => {
        const conf = PIECE_CONFIG[item.type];
        const r = bW * conf.radiusRatio;
        const charName = (mySide === 'cho') ? (item.type === '楚' ? '楚' : item.type) : (item.type === '楚' ? '漢' : item.type);

        pieces.push({
          id: mySide + '_' + Math.random().toString(36).substring(2, 9),
          side: mySide,
          char: charName,
          x: item.x,
          y: (mySide === 'cho') ? item.y : (boardBounds.top + (zBottom - item.y)),
          vx: 0, vy: 0,
          mass: conf.mass,
          radius: r,
          color: mySide === 'cho' ? '#064e3b' : '#7f1d1d',
          border: conf.border,
          ability: conf.ability,
          shield: conf.shield,
          isJumping: false,
          jumpTime: 0,
          curveTimer: 0,
          hitCooldown: 0,
          alive: true
        });
      });

      budget = 0;
      playWoodClack(0.9, 4.0);
      updateUI();
    }

    function buyPiece(char, isFree = false) {
      if (gamePhase !== 'placement') return;
      const typeKey = (char === '楚' || char === '漢') ? char : char;
      const conf = PIECE_CONFIG[typeKey];

      if (!isFree && budget < conf.cost) {
        alert('배치 포인트가 부족합니다!');
        return;
      }
      if (!isFree) budget -= conf.cost;

      const r = boardBounds.width * conf.radiusRatio;
      let spawnX = 0, spawnY = 0, attempts = 0;
      while (attempts < 50) {
        spawnX = mySpawnZone.top ? boardBounds.left + r + Math.random() * (boardBounds.width - r * 2) : 0;
        spawnY = mySpawnZone.top + r + Math.random() * (mySpawnZone.bottom - mySpawnZone.top - r * 2);
        const overlap = pieces.some(p => Math.hypot(p.x - spawnX, p.y - spawnY) < p.radius + r + 4);
        if (!overlap) break;
        attempts++;
      }

      const pieceSide = mySide;
      const displayChar = (char === '楚' || char === '漢') ? (pieceSide === 'cho' ? '楚' : '漢') : char;

      pieces.push({
        id: pieceSide + '_' + Math.random().toString(36).substring(2, 9),
        side: pieceSide,
        char: displayChar,
        x: spawnX, y: spawnY,
        vx: 0, vy: 0,
        mass: conf.mass,
        radius: r,
        color: pieceSide === 'cho' ? '#064e3b' : '#7f1d1d',
        border: conf.border,
        ability: conf.ability,
        shield: conf.shield,
        isJumping: false,
        jumpTime: 0,
        curveTimer: 0,
        hitCooldown: 0,
        alive: true
      });

      playWoodClack(0.6, conf.mass);
      updateUI();
    }

    function setupAIHanArmy() {
      const aiRoster = ['漢', '車', '包', '馬', '象'];
      aiRoster.forEach(type => {
        const conf = PIECE_CONFIG[type];
        const r = boardBounds.width * conf.radiusRatio;
        const x = boardBounds.left + r + Math.random() * (boardBounds.width - r * 2);
        const y = boardBounds.top + r + Math.random() * (boardBounds.height * 0.25 - r * 2);

        pieces.push({
          id: 'han_' + Math.random().toString(36).substring(2, 9),
          side: 'han',
          char: type,
          x: x, y: y,
          vx: 0, vy: 0,
          mass: conf.mass,
          radius: r,
          color: '#7f1d1d',
          border: conf.border,
          ability: conf.ability,
          shield: conf.shield,
          isJumping: false,
          jumpTime: 0,
          curveTimer: 0,
          hitCooldown: 0,
          alive: true
        });
      });
    }

    function toggleReady() {
      const myPieces = pieces.filter(p => p.side === mySide && p.alive);
      if (myPieces.length === 0) {
        alert('최소 1개 이상의 기물을 배치해야 합니다!');
        return;
      }

      isMyReady = true;
      document.getElementById('ready-btn').innerText = '준비 완료됨 ✅';
      document.getElementById('ready-btn').className = 'px-4 py-1.5 bg-slate-700 rounded-xl text-xs font-black shadow cursor-not-allowed';

      if (peerConn && peerConn.open) {
        peerConn.send({
          type: 'READY_SYNC',
          pieces: myPieces.map(p => ({
            id: p.id,
            side: p.side,
            char: p.char,
            x: p.x,
            y: p.y,
            mass: p.mass,
            radius: p.radius,
            color: p.color,
            border: p.border,
            ability: p.ability,
            shield: p.shield
          }))
        });

      if (isAIMode) isPeerReady = true;

    function checkStartBattle() {
      if (isMyReady && isPeerReady) {
        gamePhase = 'battle';
        document.getElementById('placement-panel').classList.add('hidden');
        document.getElementById('battle-panel').classList.remove('hidden');

        const badge = document.getElementById('game-phase-badge');
        badge.innerText = '초(청군) 차례';
        badge.className = 'px-3 py-0.5 rounded-full text-xs font-black bg-emerald-600 text-white shadow animate-pulse';
        document.getElementById('guide-text').innerText = '전투 개시! 적의 배치를 파악하고 신중히 타격하세요!';

        updateUI();
        startTimer(15);
      }
    }

    function updateUI() {
      document.getElementById('budget-display').innerText = budget;
      const choCount = pieces.filter(p => p.side === 'cho' && p.alive).length;
      const hanCount = pieces.filter(p => p.side === 'han' && p.alive).length;

      document.getElementById('my-pieces-count').innerText = `남은 기물: ${mySide === 'cho' ? choCount : hanCount}`;
      if (gamePhase === 'placement') {
        document.getElementById('opp-pieces-count').innerText = '배치 중 (비공개)';
      } else {
        document.getElementById('opp-pieces-count').innerText = `남은 기물: ${mySide === 'cho' ? hanCount : choCount}`;
      }

      if (gamePhase === 'battle' && !isGameOver) {
        if (choCount === 0) endGame('han');
        else if (hanCount === 0) endGame('cho');
      }
    }

    function endGame(winner) {
      isGameOver = true;
      clearInterval(timerInterval);
      const modal = document.getElementById('game-over-modal');
      const title = document.getElementById('over-title');
      const desc = document.getElementById('over-desc');

      if (winner === mySide) {
        title.innerText = '👑 판쓸이 대승리! 👑';
        title.className = 'text-2xl font-black title-font text-emerald-400';
        desc.innerText = '치열한 전술 끝에 적 진영을 격파했습니다!';
      } else {
        title.innerText = '💀 패배 💀';
        title.className = 'text-2xl font-black title-font text-rose-500';
        desc.innerText = '아군의 모든 기물이 장외로 떨어졌습니다.';
      }
      modal.classList.remove('hidden');
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('pointerdown', e => {
      const pos = getPointerPos(e);

      if (gamePhase === 'placement') {
        const target = pieces.find(p => p.side === mySide && Math.hypot(p.x - pos.x, p.y - pos.y) <= p.radius * 1.5);
        if (target) {
          isDragging = true;
          selectedPiece = target;
        }
      } else if (gamePhase === 'battle') {
        if (isSimulating || isGameOver || currentTurn !== mySide) return;
        const target = pieces.find(p => p.alive && p.side === mySide && Math.hypot(p.x - pos.x, p.y - pos.y) <= p.radius * 1.5);
        if (target) {
          isDragging = true;
          selectedPiece = target;
          dragStart = { x: target.x, y: target.y };
          dragCurrent = { x: pos.x, y: pos.y };
        }
      }
    });

    window.addEventListener('pointermove', e => {
      if (!isDragging || !selectedPiece) return;
      const pos = getPointerPos(e);

      if (gamePhase === 'placement') {
        const r = selectedPiece.radius;
        selectedPiece.x = Math.max(boardBounds.left + r, Math.min(boardBounds.right - r, pos.x));
        selectedPiece.y = Math.max(mySpawnZone.top + r, Math.min(mySpawnZone.bottom - r, pos.y));

        pieces.forEach(other => {
          if (other !== selectedPiece && other.side === mySide) {
            const d = Math.hypot(other.x - selectedPiece.x, other.y - selectedPiece.y);
            if (d < selectedPiece.radius + other.radius + 2) {
              const ang = Math.atan2(selectedPiece.y - other.y, selectedPiece.x - other.x);
              selectedPiece.x = other.x + Math.cos(ang) * (selectedPiece.radius + other.radius + 3);
              selectedPiece.y = other.y + Math.sin(ang) * (selectedPiece.radius + other.radius + 3);
            }
          }
        });
      } else {
        dragCurrent = pos;
      }
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging || !selectedPiece) return;

      if (gamePhase === 'battle') {
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 10) {
          clearInterval(timerInterval);

          let powerMult = 0.16;
          if (selectedPiece.ability === 'charge') powerMult = 0.23;

          const power = Math.min(dist * powerMult, 19);
          const angle = Math.atan2(dy, dx);
          const vx = Math.cos(angle) * power;
          const vy = Math.sin(angle) * power;

          selectedPiece.vx = vx;
          selectedPiece.vy = vy;

          if (selectedPiece.ability === 'cannon') {
            selectedPiece.isJumping = true;
            selectedPiece.jumpTime = 22;
            playJumpSfx();
          } else {
            playWoodClack(0.75, selectedPiece.mass);
          }

          if (selectedPiece.ability === 'curve') {
            selectedPiece.curveTimer = 25;
          }

          if (peerConn && peerConn.open) {
            peerConn.send({
              type: 'SHOOT',
              id: selectedPiece.id,
              vx: vx,
              vy: vy
            });
          }

          isSimulating = true;
        }
      }

      isDragging = false;
      selectedPiece = null;
    });

    function spawnShockwave(x, y, color = '#fbbf24', maxR = 90) {
      shockwaves.push({ x, y, r: 4, maxR, color, alpha: 1.0 });
    }

    function spawnHitParticles(x, y, color, count = 10, speedMult = 1.0) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = (1.5 + Math.random() * 4.5) * speedMult;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          alpha: 1.0,
          color: color,
          size: 1.8 + Math.random() * 2.2
        });
      }
    }

    function triggerPieceSpecialEffect(p, hitX, hitY) {
      if (p.ability === 'shockwave') {
        spawnShockwave(hitX, hitY, '#10b981', 105);
        triggerShake(7);
        playExplosionSfx(0.65);
      } else if (p.ability === 'charge') {
        visualEffects.push({ type: 'lightning', x: hitX, y: hitY, color: '#38bdf8', life: 12 });
        spawnHitParticles(hitX, hitY, '#67e8f9', 18, 1.4);
        triggerShake(5);
        playWoodClack(0.95, p.mass);
      } else if (p.ability === 'cannon') {
        visualEffects.push({ type: 'explosion', x: hitX, y: hitY, r: 8, maxR: 45, color: '#a855f7', life: 14 });
        playExplosionSfx(0.8);
        triggerShake(6);
      } else if (p.ability === 'curve') {
        visualEffects.push({ type: 'vortex', x: hitX, y: hitY, angle: 0, life: 16 });
        spawnHitParticles(hitX, hitY, '#fb923c', 14);
      } else if (p.ability === 'shield') {
        visualEffects.push({ type: 'shield_barrier', x: hitX, y: hitY, r: p.radius * 2.5, life: 12 });
        playWoodClack(0.85, p.mass);
      } else {
        spawnHitParticles(hitX, hitY, '#cbd5e1', 12, 1.1);
        playWoodClack(0.5, p.mass);
      }
    }

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1)**2 + (y2 - y1)**2;
      if (l2 === 0) return { dist: Math.hypot(px - x1, py - y1), projX: x1, projY: y1 };
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * (x2 - x1);
      const projY = y1 + t * (y2 - y1);
      const dist = Math.hypot(px - projX, py - projY);
      return { dist, projX, projY };
    }

    // 물리 업데이트
    function updatePhysics() {
      currentMap.obstacles.forEach(obs => {
        if (obs.type === 'sawblade' || obs.type === 'twin_blade') {
          obs.angle = (obs.angle + obs.speed) % (Math.PI * 2);
        }
      });

      if (!isSimulating && gamePhase === 'battle') return;

      let stillMoving = false;

      pieces.forEach(p => {
        if (!p.alive) return;
        if (p.hitCooldown > 0) p.hitCooldown--;

        if (p.isJumping) {
          p.jumpTime--;
          if (p.jumpTime <= 0) {
            p.isJumping = false;
            spawnShockwave(p.x, p.y, '#c084fc', 50);
            playExplosionSfx(0.45);
            triggerShake(4);
          }
        }

        if (p.curveTimer > 0) {
          p.curveTimer--;
          p.vx += -p.vy * 0.045;
          p.vy += p.vx * 0.045;
        }

        p.x += p.vx;
        p.y += p.vy;

        // 미끄러지는 동안 매끄러운 마찰음
        const currentSpeed = Math.hypot(p.vx, p.vy);
        if (currentSpeed > 2.0 && !p.isJumping) {
          playSlideFriction(currentSpeed);
        }

        let currentFriction = 0.983;

        if (!p.isJumping) {
          currentMap.walls.forEach(w => {
            const { dist, projX, projY } = pointToSegmentDistance(p.x, p.y, w.x1, w.y1, w.x2, w.y2);
            if (dist < p.radius + 3) {
              const nx = (p.x - projX) / (dist || 1);
              const ny = (p.y - projY) / (dist || 1);
              p.x = projX + nx * (p.radius + 3);
              p.y = projY + ny * (p.radius + 3);

              const dot = p.vx * nx + p.vy * ny;
              p.vx = (p.vx - 2 * dot * nx) * 0.82;
              p.vy = (p.vy - 2 * dot * ny) * 0.82;

              if (Math.hypot(p.vx, p.vy) > 0.8) {
                playWoodClack(0.7, p.mass);
                spawnHitParticles(projX, projY, w.color, 6);
                triggerShake(2);
              }
            }
          });

          currentMap.obstacles.forEach(obs => {
            if (obs.type === 'mountain') {
              const dist = Math.hypot(p.x - obs.x, p.y - obs.y);
              if (dist < obs.r + p.radius) {
                const nx = (p.x - obs.x) / dist;
                const ny = (p.y - obs.y) / dist;
                p.x = obs.x + nx * (obs.r + p.radius);
                p.y = obs.y + ny * (obs.r + p.radius);
                const dot = p.vx * nx + p.vy * ny;
                p.vx = (p.vx - 2 * dot * nx) * 0.78;
                p.vy = (p.vy - 2 * dot * ny) * 0.78;
                if (Math.hypot(p.vx, p.vy) > 0.8) {
                  playWoodClack(0.65, p.mass);
                  spawnHitParticles(p.x, p.y, '#94a3b8', 6);
                }
              }
            } else if (obs.type === 'water_puddle') {
              if (Math.hypot(p.x - obs.x, p.y - obs.y) < obs.r + p.radius) {
                currentFriction = 0.997;
                p.vx += (Math.random() - 0.5) * 0.18;
              }
            } else if (obs.type === 'mud') {
              if (Math.hypot(p.x - obs.x, p.y - obs.y) < obs.r + p.radius) {
                currentFriction = 0.91;
              }
            } else if (obs.type === 'sawblade') {
              const dist = Math.hypot(p.x - obs.x, p.y - obs.y);
              if (dist < obs.r + p.radius) {
                const nx = (p.x - obs.x) / dist;
                const ny = (p.y - obs.y) / dist;
                p.vx = nx * 8.0;
                p.vy = ny * 8.0;
                if (p.shield > 0) p.shield--;
                playSlashDamageSfx();
                spawnHitParticles(p.x, p.y, '#ef4444', 16, 1.5);
                triggerShake(6);
              }
            } else if (obs.type === 'twin_blade') {
              const x2 = obs.x + Math.cos(obs.angle) * obs.len;
              const y2 = obs.y + Math.sin(obs.angle) * obs.len;
              const x1 = obs.x - Math.cos(obs.angle) * obs.len;
              const y1 = obs.y - Math.sin(obs.angle) * obs.len;

              const { dist, projX, projY } = pointToSegmentDistance(p.x, p.y, x1, y1, x2, y2);
              if (dist < p.radius + 4) {
                const pushAngle = obs.angle + Math.PI / 2;
                p.vx += Math.cos(pushAngle) * 7.5;
                p.vy += Math.sin(pushAngle) * 7.5;
                playSlashDamageSfx();
                spawnShockwave(projX, projY, '#f59e0b', 35);
                triggerShake(4);
              }
            }
          });
        }

        p.vx *= currentFriction;
        p.vy *= currentFriction;

        if (Math.hypot(p.vx, p.vy) > 0.12) {
          stillMoving = true;
          if (Math.random() < 0.2) spawnHitParticles(p.x, p.y, p.border, 1);
        } else {
          p.vx = 0; p.vy = 0;
        }

        if (p.x < boardBounds.left || p.x > boardBounds.right || p.y < boardBounds.top || p.y > boardBounds.bottom) {
          if (p.shield > 0) {
            p.shield--;
            p.x = Math.max(boardBounds.left + p.radius + 2, Math.min(boardBounds.right - p.radius - 2, p.x));
            p.y = Math.max(boardBounds.top + p.radius + 2, Math.min(boardBounds.bottom - p.radius - 2, p.y));
            p.vx = -p.vx * 0.65;
            p.vy = -p.vy * 0.65;
            playBarrierSaveSfx();
            spawnShockwave(p.x, p.y, '#38bdf8', 75);
            triggerShake(6);
          } else {
            p.alive = false;
            p.vx = 0; p.vy = 0;
            playFallSfx();
            spawnShockwave(p.x, p.y, '#ef4444', 45);
            triggerShake(4);
            updateUI();
          }
        }
      });

      // 기물 간 탄성 충돌
      for (let i = 0; i < pieces.length; i++) {
        for (let j = i + 1; j < pieces.length; j++) {
          const p1 = pieces[i];
          const p2 = pieces[j];
          if (!p1.alive || !p2.alive) continue;
          if (p1.isJumping || p2.isJumping) continue;

          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.hypot(dx, dy);

          if (dist < p1.radius + p2.radius) {
            const relSpd = Math.hypot(p1.vx - p2.vx, p1.vy - p2.vy);
            const hitX = (p1.x + p2.x) / 2;
            const hitY = (p1.y + p2.y) / 2;

            if (relSpd > 0.8 && p1.hitCooldown === 0 && p2.hitCooldown === 0) {
              triggerPieceSpecialEffect(p1, hitX, hitY);
              triggerPieceSpecialEffect(p2, hitX, hitY);
              playWoodClack(relSpd * 0.14, Math.max(p1.mass, p2.mass));
              p1.hitCooldown = 6;
              p2.hitCooldown = 6;
            }

            if ((p1.ability === 'shockwave' || p2.ability === 'shockwave') && relSpd > 5) {
              pieces.forEach(target => {
                if (target !== p1 && target !== p2 && target.alive && !target.isJumping) {
                  const td = Math.hypot(target.x - hitX, target.y - hitY);
                  if (td < 110) {
                    const ang = Math.atan2(target.y - hitY, target.x - hitX);
                    target.vx += Math.cos(ang) * 3.5;
                    target.vy += Math.sin(ang) * 3.5;
                  }
                }
              });
            }

            const angle = Math.atan2(dy, dx);
            const sin = Math.sin(angle);
            const cos = Math.cos(angle);

            const overlap = (p1.radius + p2.radius - dist) / 2;
            p1.x -= cos * (overlap + 0.5);
            p1.y -= sin * (overlap + 0.5);
            p2.x += cos * (overlap + 0.5);
            p2.y += sin * (overlap + 0.5);

            const vx1 = p1.vx * cos + p1.vy * sin;
            const vy1 = p1.vy * cos - p1.vx * sin;
            const vx2 = p2.vx * cos + p2.vy * sin;
            const vy2 = p2.vy * cos - p2.vx * sin;

            const m1 = p1.mass;
            const m2 = p2.mass;
            const vx1F = ((m1 - m2) * vx1 + 2 * m2 * vx2) / (m1 + m2);
            const vx2F = ((m2 - m1) * vx2 + 2 * m1 * vx1) / (m1 + m2);

            p1.vx = vx1F * cos - vy1 * sin;
            p1.vy = vy1 * cos + vx1F * sin;
            p2.vx = vx2F * cos - vy2 * sin;
            p2.vy = vy2 * cos + vx2F * sin;
          }
        }
      }

      if (!stillMoving && isSimulating) {
        isSimulating = false;
        currentTurn = (currentTurn === 'cho') ? 'han' : 'cho';
        onTurnSwitched();
      }
    }

    function onTurnSwitched() {
      const badge = document.getElementById('game-phase-badge');
      const guide = document.getElementById('guide-text');

      if (currentTurn === mySide) {
        badge.innerText = `${mySide === 'cho' ? '초(내 턴)' : '한(내 턴)'} 차례`;
        badge.className = 'px-3 py-0.5 rounded-full text-xs font-black bg-emerald-600 text-white shadow animate-pulse';
        guide.innerText = '15초 내에 짧은 궤적을 확인하며 조준하세요!';
      } else {
        badge.innerText = '상대방 턴 진행 중...';
        badge.className = 'px-3 py-0.5 rounded-full text-xs font-black bg-red-600 text-white shadow animate-pulse';
        guide.innerText = '상대방의 샷을 주시하세요.';

        if (isAIMode && currentTurn === 'han') {
          setTimeout(triggerAIMove, 700);
        }
      }
      startTimer(15);
    }

    function triggerAIMove() {
      if (isGameOver || gamePhase !== 'battle') return;
      const hanList = pieces.filter(p => p.side === 'han' && p.alive);
      const choList = pieces.filter(p => p.side === 'cho' && p.alive);
      if (hanList.length === 0 || choList.length === 0) return;

      const shooter = hanList[Math.floor(Math.random() * hanList.length)];
      let target = choList[0];
      let minD = 9999;
      choList.forEach(c => {
        const d = Math.hypot(c.x - shooter.x, c.y - shooter.y);
        if (d < minD) { minD = d; target = c; }
      });

      const angle = Math.atan2(target.y - shooter.y, target.x - shooter.x) + (Math.random() - 0.5) * 0.15;
      const power = 13 + Math.random() * 5;
      shooter.vx = Math.cos(angle) * power;
      shooter.vy = Math.sin(angle) * power;

      if (shooter.ability === 'cannon') {
        shooter.isJumping = true;
        shooter.jumpTime = 22;
        playJumpSfx();
      } else {
        playWoodClack(0.85, shooter.mass);
      }
      clearInterval(timerInterval);
      isSimulating = true;
    }

    function render() {
      const w = parseFloat(canvas.style.width);
      const h = parseFloat(canvas.style.height);
      ctx.clearRect(0, 0, w, h);

      ctx.save();
      if (shakeIntensity > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
        shakeIntensity *= 0.88;
        if (shakeIntensity < 0.2) shakeIntensity = 0;
      }

      ctx.fillStyle = currentMap.bg;
      ctx.fillRect(boardBounds.left, boardBounds.top, boardBounds.width, boardBounds.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 16; i++) {
        const x = boardBounds.left + (boardBounds.width / 16) * i;
        ctx.beginPath(); ctx.moveTo(x, boardBounds.top); ctx.lineTo(x, boardBounds.bottom); ctx.stroke();
      }
      for (let i = 0; i <= 12; i++) {
        const y = boardBounds.top + (boardBounds.height / 12) * i;
        ctx.beginPath(); ctx.moveTo(boardBounds.left, y); ctx.lineTo(boardBounds.right, y); ctx.stroke();
      }

      currentMap.walls.forEach(w => {
        ctx.save();
        ctx.strokeStyle = w.color;
        ctx.lineWidth = 5.5;
        ctx.shadowColor = w.color;
        ctx.shadowBlur = 10;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
        ctx.restore();
      });

      currentMap.obstacles.forEach(obs => {
        if (obs.type === 'mountain') {
          ctx.save();
          ctx.translate(obs.x, obs.y);
          ctx.fillStyle = '#334155';
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 2;
          ctx.beginPath();
          obs.points.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.strokeStyle = '#475569';
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(obs.points[0].x * 0.7, obs.points[0].y * 0.7);
          ctx.moveTo(0, 0); ctx.lineTo(obs.points[3].x * 0.7, obs.points[3].y * 0.7);
          ctx.stroke();
          ctx.restore();
        } else if (obs.type === 'water_puddle') {
          ctx.save();
          ctx.fillStyle = 'rgba(2, 132, 199, 0.35)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(obs.x, obs.y, obs.rx, obs.ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.strokeStyle = 'rgba(125, 211, 252, 0.4)';
          ctx.beginPath();
          ctx.ellipse(obs.x, obs.y, obs.rx * 0.55, obs.ry * 0.55, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (obs.type === 'mud') {
          ctx.save();
          ctx.fillStyle = 'rgba(120, 53, 15, 0.45)';
          ctx.strokeStyle = '#92400e';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#b45309';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('진흙', obs.x, obs.y + 3);
          ctx.restore();
        } else if (obs.type === 'sawblade') {
          ctx.save();
          ctx.translate(obs.x, obs.y);
          ctx.rotate(obs.angle);
          ctx.fillStyle = '#475569';
          ctx.strokeStyle = '#f87171';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, obs.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#dc2626';
          for (let s = 0; s < 8; s++) {
            ctx.rotate(Math.PI / 4);
            ctx.beginPath();
            ctx.moveTo(obs.r, -3);
            ctx.lineTo(obs.r + 5, 0);
            ctx.lineTo(obs.r, 3);
            ctx.fill();
          }
          ctx.restore();
        } else if (obs.type === 'twin_blade') {
          ctx.save();
          ctx.translate(obs.x, obs.y);
          ctx.rotate(obs.angle);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-obs.len, -2.5, obs.len * 2, 5);
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      });

      if (gamePhase === 'placement') {
        ctx.save();
        ctx.fillStyle = mySide === 'cho' ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)';
        ctx.strokeStyle = mySide === 'cho' ? '#10b981' : '#ef4444';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.strokeRect(boardBounds.left, mySpawnZone.top, boardBounds.width, mySpawnZone.bottom - mySpawnZone.top);
        ctx.fillRect(boardBounds.left, mySpawnZone.top, boardBounds.width, mySpawnZone.bottom - mySpawnZone.top);
        ctx.fillStyle = mySide === 'cho' ? '#34d399' : '#f87171';
        ctx.font = 'bold 11px "Jua"';
        ctx.fillText(`내 진영 배치 구역 (${mySide === 'cho' ? '초군' : '한군'})`, boardBounds.left + 10, mySpawnZone.top + 18);
        ctx.restore();

        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
        ctx.fillRect(boardBounds.left, oppSpawnZone.top, boardBounds.width, oppSpawnZone.bottom - oppSpawnZone.top);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(boardBounds.left, oppSpawnZone.top, boardBounds.width, oppSpawnZone.bottom - oppSpawnZone.top);

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 12px "Jua"';
        ctx.textAlign = 'center';
        ctx.fillText('🌫️ 상대방 진영 (비공개 배치 중) 🌫️', boardBounds.left + boardBounds.width / 2, oppSpawnZone.top + (oppSpawnZone.bottom - oppSpawnZone.top) / 2);
        ctx.restore();
      }

      ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
      ctx.lineWidth = 3;
      ctx.strokeRect(boardBounds.left, boardBounds.top, boardBounds.width, boardBounds.height);

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        ctx.save();
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = sw.alpha;
        ctx.lineWidth = 3.5 * sw.alpha;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        sw.r += 4.2;
        sw.alpha -= 0.045;
        if (sw.alpha <= 0 || sw.r >= sw.maxR) shockwaves.splice(i, 1);
      }

      for (let i = visualEffects.length - 1; i >= 0; i--) {
        const vf = visualEffects[i];
        ctx.save();
        if (vf.type === 'lightning') {
          ctx.strokeStyle = vf.color;
          ctx.lineWidth = 2.5;
          ctx.shadowColor = vf.color;
          ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.moveTo(vf.x, vf.y);
          for (let step = 0; step < 4; step++) {
            ctx.lineTo(vf.x + (Math.random() - 0.5) * 35, vf.y + (Math.random() - 0.5) * 35);
          }
          ctx.stroke();
        } else if (vf.type === 'explosion') {
          ctx.fillStyle = 'rgba(168, 85, 247, 0.35)';
          ctx.strokeStyle = '#d8b4fe';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(vf.x, vf.y, vf.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          vf.r += 2.8;
        } else if (vf.type === 'vortex') {
          ctx.strokeStyle = 'rgba(251, 146, 60, 0.6)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(vf.x, vf.y, 18, vf.angle, vf.angle + Math.PI); ctx.stroke();
          vf.angle += 0.4;
        } else if (vf.type === 'shield_barrier') {
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(vf.x, vf.y, vf.r, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
        vf.life--;
        if (vf.life <= 0) visualEffects.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= 0.038;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }

      pieces.forEach(p => {
        if (!p.alive) return;
        if (gamePhase === 'placement' && p.side !== mySide) return;

        const isCho = (p.side === 'cho');

        ctx.save();
        ctx.translate(p.x, p.y);

        const scale = p.isJumping ? 1.4 : 1.0;
        ctx.scale(scale, scale);

        if (p.shield > 0) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2.0;
          ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.arc(0, 0, p.radius + 4, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
        }

        const grad = ctx.createRadialGradient(-p.radius * 0.3, -p.radius * 0.3, p.radius * 0.1, 0, 0, p.radius);
        if (isCho) {
          grad.addColorStop(0, '#059669');
          grad.addColorStop(1, '#064e3b');
        } else {
          grad.addColorStop(0, '#dc2626');
          grad.addColorStop(1, '#7f1d1d');
        }

        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill();

        ctx.lineWidth = 3.0;
        ctx.strokeStyle = p.border;
        ctx.shadowColor = p.border;
        ctx.shadowBlur = 8;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 ${p.radius * 1.25}px 'Jua'`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.char, 0, 1.2);

        if (p.isJumping) {
          ctx.fillStyle = '#c084fc';
          ctx.font = 'bold 8px sans-serif';
          ctx.fillText('도약', 0, -p.radius * 1.3);
        }

        ctx.restore();
      });

      if (isDragging && selectedPiece && gamePhase === 'battle') {
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 8) {
          let powerMult = 0.16;
          if (selectedPiece.ability === 'charge') powerMult = 0.23;
          const power = Math.min(dist * powerMult, 19);
          const angle = Math.atan2(dy, dx);

          ctx.save();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.lineWidth = 1.8;
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(dragStart.x, dragStart.y); ctx.lineTo(dragCurrent.x, dragCurrent.y); ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = selectedPiece.border;
          ctx.fillStyle = selectedPiece.border;
          ctx.lineWidth = 2.5;

          let simX = dragStart.x;
          let simY = dragStart.y;
          let simVx = Math.cos(angle) * power;
          let simVy = Math.sin(angle) * power;

          ctx.beginPath();
          ctx.moveTo(simX, simY);

          const steps = 8;
          for (let step = 1; step <= steps; step++) {
            if (selectedPiece.ability === 'curve') {
              simVx += -simVy * 0.045;
              simVy += simVx * 0.045;
            }
            simX += simVx;
            simY += simVy;
            if (selectedPiece.ability === 'cannon') {
              ctx.setLineDash([3, 3]);
            }
            ctx.lineTo(simX, simY);
          }
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(simX, simY, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      ctx.restore();

      updatePhysics();
      requestAnimationFrame(render);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupNickname();
      resizeCanvas();
      generateRandomMap();
      initP2P();
      buyPiece('楚', true);
      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
