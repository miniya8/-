<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>세미니의 멀티센터 전설장기1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap');
    
    html {
      width: 100%;
      height: 100%;
      background-color: #09090b;
    }
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at 50% 20%, #1e1b4b, #09090b);
      overscroll-behavior: none;
    }
    .title-font { font-family: 'Black Han Sans', 'Jua', sans-serif; }
    .piece-hanja { font-family: 'Noto Serif KR', serif; }

    @keyframes smoothScaleIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-smooth-in {
      animation: smoothScaleIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .text-stroke-shout {
      -webkit-text-stroke: 3.5px rgba(0, 0, 0, 0.95);
      paint-order: stroke fill;
      text-shadow: 0 0 14px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body id="app-root" class="text-white flex flex-col justify-between items-center p-2 box-border">

  <!-- 상단 상태바 -->
  <header class="w-full max-w-md flex flex-col gap-1 z-20 flex-shrink-0">
    <div class="flex items-center justify-between bg-slate-900/95 px-3 py-1.5 rounded-2xl border border-slate-700/80 shadow-xl">
      <!-- 상대 정보 -->
      <div class="flex items-center gap-1.5">
        <div class="relative">
          <div id="opp-avatar" class="w-8 h-8 rounded-full border-2 border-red-500 bg-slate-950 flex items-center justify-center shadow overflow-hidden">
            <canvas id="opp-avatar-canvas" class="w-full h-full object-cover hidden"></canvas>
            <span id="opp-avatar-text" class="text-amber-300 title-font text-xs">한</span>
          </div>
          <span id="opp-badge" class="absolute -bottom-1 -right-1 text-[9px] bg-red-600 text-white px-1 py-0.2 rounded-full font-black">한</span>
        </div>
        <div class="flex flex-col">
          <span id="opp-name" class="font-bold text-[11px] text-slate-100 flex items-center gap-1 leading-tight">상대방</span>
          <span id="opp-status-badge" class="text-[9px] text-amber-400 font-bold">경고 0/3</span>
        </div>
      </div>

      <!-- 중앙 턴 상태 & 제한시간 -->
      <div class="flex flex-col items-center">
        <div id="turn-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-black bg-emerald-600 text-white shadow-md animate-pulse">초 차례</div>
        <div class="flex items-center gap-1 mt-0.5">
          <span class="text-[9px] text-slate-400 font-bold">남은시간</span>
          <span id="timer-text" class="text-xs font-black text-amber-300 title-font">45s</span>
        </div>
        <div class="w-14 h-1 bg-slate-800 rounded-full overflow-hidden mt-0.5 border border-slate-700">
          <div id="timer-bar" class="h-full bg-amber-400 transition-all duration-300" style="width: 100%;"></div>
        </div>
      </div>

      <!-- 내 정보 & 사운드/퇴장 -->
      <div class="flex items-center gap-1.5 flex-row-reverse text-right">
        <button onclick="returnToLobby()" class="px-2 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-[10px] font-bold text-slate-200 shadow">
          🏠 로비
        </button>

        <div class="flex items-center gap-1.5 flex-row-reverse">
          <div class="relative">
            <div id="my-avatar" class="w-8 h-8 rounded-full border-2 border-emerald-500 bg-slate-950 flex items-center justify-center shadow overflow-hidden">
              <canvas id="my-avatar-canvas" class="w-full h-full object-cover hidden"></canvas>
              <span id="my-avatar-text" class="text-emerald-300 title-font text-xs">초</span>
            </div>
            <span id="my-badge" class="absolute -bottom-1 -left-1 text-[9px] bg-emerald-600 text-white px-1 py-0.2 rounded-full font-black">초</span>
          </div>
          <div class="flex flex-col">
            <span id="my-name" class="font-bold text-[11px] text-slate-100 leading-tight">나</span>
            <span id="my-status-badge" class="text-[9px] text-emerald-400 font-bold">경고 0/3</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 장기판 캔버스 영역 -->
  <main id="main-area" class="w-full flex-1 flex items-center justify-center overflow-hidden my-1 relative">
    <div id="board-container" class="relative rounded-2xl shadow-2xl bg-gradient-to-b from-amber-950 via-amber-900 to-amber-950 p-1 border-2 border-amber-700/80 overflow-hidden flex items-center justify-center">
      <canvas id="boardCanvas" class="rounded-xl cursor-pointer block touch-none"></canvas>

      <!-- 외통수/장군 배너 -->
      <div id="check-banner" class="absolute inset-0 flex items-center justify-center pointer-events-none hidden z-40">
        <div class="bg-rose-600/90 border-4 border-yellow-300 text-yellow-200 px-5 py-2 rounded-2xl shadow-2xl title-font text-2xl font-black tracking-widest animate-bounce">
          ⚡ 장 군 ! ⚡
        </div>
      </div>

      <!-- 대국 종료 모달 -->
      <div id="mate-banner" class="absolute inset-0 z-[115] bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3 pointer-events-auto">
        <div class="bg-slate-900 border-2 border-amber-400 text-white px-5 py-5 rounded-3xl text-center w-full max-w-[270px] animate-smooth-in">
          <div id="mate-title-text" class="text-xl font-black title-font text-amber-300">👑 대국 종료 👑</div>
          <div id="mate-winner-text" class="text-xs text-slate-200 mt-2">상대 진영을 격파했습니다!</div>
          <div class="flex flex-col gap-2 mt-4">
            <button onclick="requestRematch()" class="w-full py-2 bg-emerald-600 text-white rounded-xl font-bold text-xs shadow">🔄 다시 하기</button>
            <button onclick="returnToLobby()" class="w-full py-2 bg-slate-800 text-slate-200 border border-slate-600 rounded-xl font-bold text-xs">🏠 로비로 나가기</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 컨트롤 바 -->
  <footer class="w-full max-w-md flex flex-col gap-1.5 z-20 flex-shrink-0 pb-1">
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="triggerCooldownTaunt('mock')" class="bg-rose-950/80 text-rose-200 border border-rose-700/60 rounded-xl py-2 text-xs font-bold">😏 약올림</button>
      <button onclick="triggerCooldownTaunt('fact')" class="bg-purple-950/80 text-purple-200 border border-purple-700/60 rounded-xl py-2 text-xs font-bold">💣 팩폭도발</button>
      <button onclick="requestUndoMove()" class="bg-indigo-950/80 text-indigo-200 border border-indigo-700/70 rounded-xl py-2 text-xs font-bold">↩ 물리기</button>
      <button onclick="requestPass()" class="bg-slate-800 text-slate-200 border border-slate-600 rounded-xl py-2 text-xs font-bold">한 수 쉼</button>
    </div>
  </footer>

  <!-- 로비 모달 -->
  <div id="mode-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-5 w-full max-w-sm shadow-2xl flex flex-col gap-3">
      <h1 class="text-xl font-black title-font text-amber-400 text-center">⚔ 전설장기 ⚔</h1>
      <button onclick="startDirectGame()" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-2xl font-bold text-sm shadow-xl">
        🤖 컴퓨터(AI)와 대전 시작
      </button>
    </div>
  </div>

  <script>
    const ROWS = 10;
    const COLS = 9;
    let board = [];
    let currentTurn = 'cho';
    let mySide = 'cho';
    let isGameOver = false;
    let selectedPos = null;
    let validMoves = [];

    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');
    let cellW = 0, cellH = 0, padX = 0, padY = 0;

    // 모바일 높이 고정 및 리사이즈
    function fitScreenHeight() {
      const vh = window.innerHeight;
      document.getElementById('app-root').style.height = `${vh}px`;
    }

    function resizeCanvas() {
      fitScreenHeight();
      const mainArea = document.getElementById('main-area');
      const container = document.getElementById('board-container');

      const maxW = mainArea.clientWidth - 12;
      const maxH = mainArea.clientHeight - 12;

      const targetRatio = 8.5 / 10;
      let w = maxW;
      let h = w / targetRatio;

      if (h > maxH) {
        h = maxH;
        w = h * targetRatio;
      }

      container.style.width = `${Math.floor(w)}px`;
      container.style.height = `${Math.floor(h)}px`;

      canvas.width = Math.floor(w - 8) * window.devicePixelRatio;
      canvas.height = Math.floor(h - 8) * window.devicePixelRatio;
      canvas.style.width = `${Math.floor(w - 8)}px`;
      canvas.style.height = `${Math.floor(h - 8)}px`;

      ctx.resetTransform();
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      padX = (w - 8) * 0.07;
      padY = (h - 8) * 0.06;
      cellW = ((w - 8) - padX * 2) / (COLS - 1);
      cellH = ((h - 8) - padY * 2) / (ROWS - 1);

      drawBoard();
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

    function initBoard() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      const btm9 = ['cha', 'ma', 'sang', 'sa', null, 'sa', 'sang', 'ma', 'cha'];
      const top0 = ['cha', 'ma', 'sang', 'sa', null, 'sa', 'sang', 'ma', 'cha'];
      for (let c = 0; c < COLS; c++) {
        if (top0[c]) board[0][c] = { side: 'han', type: top0[c] };
        if (btm9[c]) board[9][c] = { side: 'cho', type: btm9[c] };
      }
      board[1][4] = { side: 'han', type: 'king' };
      board[8][4] = { side: 'cho', type: 'king' };
      board[2][1] = { side: 'han', type: 'po' }; board[2][7] = { side: 'han', type: 'po' };
      board[7][1] = { side: 'cho', type: 'po' }; board[7][7] = { side: 'cho', type: 'po' };
      for (let c = 0; c < COLS; c += 2) {
        board[3][c] = { side: 'han', type: 'byung' };
        board[6][c] = { side: 'cho', type: 'jol' };
      }
    }

    function drawBoard() {
      const w = parseFloat(canvas.style.width);
      const h = parseFloat(canvas.style.height);
      if (!w || !h) return;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = '#b45309';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#451a03';
      ctx.lineWidth = 1.6;
      for (let r = 0; r < ROWS; r++) {
        ctx.beginPath(); ctx.moveTo(padX, padY + r * cellH); ctx.lineTo(w - padX, padY + r * cellH); ctx.stroke();
      }
      for (let c = 0; c < COLS; c++) {
        ctx.beginPath(); ctx.moveTo(padX + c * cellW, padY); ctx.lineTo(padX + c * cellW, h - padY); ctx.stroke();
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = board[r][c];
          if (p) {
            const px = padX + c * cellW;
            const py = padY + r * cellH;
            const rad = Math.min(cellW, cellH) * 0.44;

            ctx.beginPath();
            ctx.arc(px, py, rad, 0, Math.PI * 2);
            ctx.fillStyle = p.side === 'cho' ? '#064e3b' : '#7f1d1d';
            ctx.fill();
            ctx.strokeStyle = p.side === 'cho' ? '#34d399' : '#f87171';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${rad * 1.1}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let txt = p.type === 'king' ? (p.side === 'cho' ? '楚' : '漢') : (p.type === 'cha' ? '車' : (p.type === 'po' ? '包' : (p.type === 'ma' ? '馬' : (p.type === 'sang' ? '象' : (p.type === 'sa' ? '士' : '卒')))));
            ctx.fillText(txt, px, py);
          }
        }
      }
    }

    function startDirectGame() {
      document.getElementById('mode-modal').classList.add('hidden');
      initBoard();
      resizeCanvas();
    }

    function returnToLobby() {
      document.getElementById('mode-modal').classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initBoard();
      resizeCanvas();
    });
  </script>
</body>
</html>
