<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>복불복 핀볼 룸 - 세미니의 놀이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      background: #09090b;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .title-font { font-family: 'Black Han Sans', 'Jua', sans-serif; }

    /* 화면 하단 안내 토스트 애니메이션 */
    @keyframes toast-up {
      0% { transform: translateY(100%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .animate-toast {
      animation: toast-up 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="text-white flex flex-col justify-between relative">

  <!-- 카카오톡 스타일 상단 헤더 -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0 shadow-lg z-20">
    <div class="flex items-center gap-2">
      <button onclick="location.href='../../index.html'" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-1">
        <span>◀</span> 로비
      </button>
      <h1 class="text-base sm:text-lg font-black text-rose-400 title-font flex items-center gap-1">
        <span>🎰</span> 복불복 핀볼
      </h1>
    </div>

    <!-- 오류 없는 2대 핵심 버튼 -->
    <div class="flex items-center gap-1.5">
      <!-- 1. 단톡방 초대 링크 원터치 복사 -->
      <button onclick="copyInviteToClipboard()" class="px-3 py-1.5 bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs rounded-xl shadow-md transition flex items-center gap-1">
        <span>📤</span> 단톡방 초대
      </button>

      <!-- 2. 카카오톡 실행 및 가이드 -->
      <button onclick="openKakaoDirect()" class="px-3.5 py-1.5 bg-[#FEE500] hover:bg-[#FDD835] active:bg-[#E5CB00] text-[#191919] font-black text-xs rounded-xl shadow-md transition flex items-center gap-1.5 active:scale-95">
        <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24">
          <path d="M12 3c-5.52 0-10 3.58-10 8 0 2.87 1.88 5.38 4.72 6.74-.21.78-.76 2.81-.87 3.24-.14.54.2.53.42.38.17-.11 2.76-1.87 3.86-2.63.61.08 1.24.13 1.87.13 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
        </svg>
        <span>카톡 화면공유</span>
      </button>
    </div>
  </header>

  <!-- 메인 핀볼 게임 화면 -->
  <main class="w-full flex-1 relative bg-slate-950 overflow-hidden">
    <iframe 
      id="pinball-frame"
      src="https://lazygyu.github.io/roulette/" 
      class="w-full h-full border-0 block"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
      loading="eager">
    </iframe>
  </main>

  <!-- 하단 안내 바 -->
  <footer class="w-full bg-slate-900/95 border-t border-slate-800 px-3 py-2 flex items-center justify-between text-[11px] text-slate-300 shrink-0 z-20">
    <div class="flex items-center gap-1.5 truncate">
      <span class="w-2 h-2 rounded-full bg-[#FEE500] shrink-0"></span>
      <span class="truncate">카톡 단톡방에서 <strong>[페이스톡 ▶ 화면공유]</strong>를 켜면 방송됩니다!</span>
    </div>
    <button onclick="reloadPinball()" class="text-rose-400 font-bold shrink-0 ml-2 hover:underline">
      새로고침 🔄
    </button>
  </footer>

  <!-- 복사 성공 모바일 커스텀 알림 모달 (브라우저 기본 팝업 에러 원천 차단) -->
  <div id="copy-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-3xl p-5 shadow-2xl text-center animate-toast space-y-4">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-500/20 border border-emerald-400 flex items-center justify-center text-2xl">
        ✅
      </div>
      <div>
        <h3 class="text-base font-black text-white title-font">초대 링크 복사 완료!</h3>
        <p class="text-xs text-slate-300 mt-1 leading-relaxed">
          카카오톡 단톡방 입력창을 <strong>길게 눌러 붙여넣기</strong> 하시면 친구들이 바로 입장합니다.
        </p>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-[11px] text-slate-400 break-all select-all font-mono" id="modal-url-display">
        -
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="closeCopyModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition">
          닫기
        </button>
        <button onclick="openKakaoDirect(); closeCopyModal();" class="flex-1 py-2.5 bg-[#FEE500] text-[#191919] text-xs font-black rounded-xl shadow transition">
          카톡 바로가기 💬
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. 단톡방 초대 버튼: 카카오톡 인앱 브라우저에서도 오류가 절대 안 나는 100% 무에러 복사
    function copyInviteToClipboard() {
      const shareUrl = window.location.href;
      document.getElementById('modal-url-display').innerText = shareUrl;

      // 현대식 클립보드 API 시도
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showModal();
        }).catch(() => {
          execCommandFallback(shareUrl);
        });
      } else {
        // 비보안 / 구형 웹뷰용 Fallback 실행
        execCommandFallback(shareUrl);
      }
    }

    // 구형 모바일 웹뷰 및 인앱 브라우저 호환 복사 엔진
    function execCommandFallback(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.top = "-9999px";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        document.execCommand('copy');
      } catch (err) {
        console.warn('execCommand copy 실패:', err);
      }
      document.body.removeChild(textArea);
      showModal();
    }

    function showModal() {
      document.getElementById('copy-modal').classList.remove('hidden');
    }

    function closeCopyModal() {
      document.getElementById('copy-modal').classList.add('hidden');
    }

    // 2. 카카오톡 앱 즉시 호출 (카카오톡 고유 표준 스키마 kakaotalk://)
    function openKakaoDirect() {
      // kakaolink 대신 안전한 카카오톡 메인 스키마 호출
      window.location.href = "kakaotalk://";

      // 0.6초 후 복귀 시 가이드 안내
      setTimeout(() => {
        // 앱이 없는 환경이거나 차단되었을 때를 대비한 부드러운 가이드 유지
      }, 600);
    }

    function reloadPinball() {
      const frame = document.getElementById('pinball-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
