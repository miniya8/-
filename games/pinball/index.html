<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복불복 핀볼 룸 - 세미니 게임센터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b, #09090b);
      user-select: none;
    }
    .title-font { font-family: 'Black Han Sans', 'Jua', sans-serif; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-3 sm:p-5">

  <!-- 헤더 -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-between bg-slate-900/90 border border-slate-700 rounded-2xl p-4 shadow-xl">
    <div class="flex items-center gap-3">
      <button onclick="location.href='../../index.html'" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-600 transition">
        ◀ 로비로
      </button>
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-rose-400 title-font flex items-center gap-2">
          <span>🎰</span> 복불복 핀볼 룰렛
        </h1>
        <p class="text-xs text-slate-400">오류 없는 원본 고화질 핀볼 & 실시간 함께 보기</p>
      </div>
    </div>

    <!-- 간단 제어 버튼 -->
    <div class="flex items-center gap-2">
      <button onclick="openOriginalPopout()" class="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-xs font-black rounded-xl shadow transition">
        새 팝업창으로 열기 ↗
      </button>
    </div>
  </header>

  <!-- 메인 작업 공간 -->
  <main class="w-full max-w-6xl mx-auto my-4 flex-1 flex flex-col gap-3">
    
    <!-- 실시간 같이 보기 안내 바 -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2 text-slate-300">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span><strong>친구들과 같이 보는 팁:</strong> 아래 화면을 띄워두고 <strong>디스코드</strong>나 <strong>구글 미트</strong> 화면 공유를 켜면 끊김 없이 최고 화질로 공유됩니다.</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="copyCurrentUrl()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-slate-300 font-bold transition">
          🔗 현재 링크 복사
        </button>
      </div>
    </div>

    <!-- 원본 게임 임베드 영역 (오류 위험 없는 완벽 동작) -->
    <div class="w-full flex-1 min-h-[700px] bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative">
      <iframe 
        id="pinball-frame"
        src="https://lazygyu.github.io/roulette/" 
        class="w-full h-full border-0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>

  </main>

  <footer class="w-full max-w-6xl mx-auto py-2 text-center text-xs text-slate-500">
    © 2026 세미니의 전설 종합 게임센터
  </footer>

  <script>
    const TARGET_URL = 'https://lazygyu.github.io/roulette/';

    function openOriginalPopout() {
      // 핀볼에 최적화된 종횡비 팝업창 열기
      window.open(TARGET_URL, 'pinball_popup', 'width=600,height=800,menubar=no,status=no,toolbar=no');
    }

    function copyCurrentUrl() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('게임 센터 링크가 복사되었습니다! 친구들에게 공유하세요.');
      });
    }
  </script>
</body>
</html>
