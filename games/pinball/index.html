<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>복불복 핀볼 룸 - 세미니의 놀이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      background: #09090b;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .title-font { font-family: 'Black Han Sans', 'Jua', sans-serif; }

    @keyframes pop-in {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: pop-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="text-white flex flex-col justify-between relative">

  <!-- 상단 헤더 -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0 shadow-lg z-20">
    <div class="flex items-center gap-2">
      <button onclick="location.href='../../index.html'" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-1">
        <span>◀</span> 로비
      </button>
      <h1 class="text-base sm:text-lg font-black text-rose-400 title-font flex items-center gap-1">
        <span>🎰</span> 복불복 핀볼
      </h1>
    </div>

    <!-- 버튼 세트 (충돌 유발 코드 완전 제거) -->
    <div class="flex items-center gap-1.5">
      <!-- 1. 단톡방 초대 버튼 -->
      <button onclick="openInviteModal()" class="px-3 py-1.5 bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs rounded-xl shadow transition flex items-center gap-1">
        <span>📤</span> 단톡방 초대
      </button>

      <!-- 2. 화면공유 퀵가이드 버튼 (에러 0% 보장) -->
      <button onclick="openShareGuideModal()" class="px-3.5 py-1.5 bg-[#FEE500] hover:bg-[#FDD835] active:bg-[#E5CB00] text-[#191919] font-black text-xs rounded-xl shadow-md transition flex items-center gap-1.5 active:scale-95">
        <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24">
          <path d="M12 3c-5.52 0-10 3.58-10 8 0 2.87 1.88 5.38 4.72 6.74-.21.78-.76 2.81-.87 3.24-.14.54.2.53.42.38.17-.11 2.76-1.87 3.86-2.63.61.08 1.24.13 1.87.13 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
        </svg>
        <span>카톡 화면공유</span>
      </button>
    </div>
  </header>

  <!-- 원본 핀볼 웹뷰 영역 -->
  <main class="w-full flex-1 relative bg-slate-950 overflow-hidden">
    <iframe 
      id="pinball-frame"
      src="https://lazygyu.github.io/roulette/" 
      class="w-full h-full border-0 block"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
      loading="eager">
    </iframe>
  </main>

  <!-- 하단 상태 바 -->
  <footer class="w-full bg-slate-900/95 border-t border-slate-800 px-3 py-2 flex items-center justify-between text-[11px] text-slate-300 shrink-0 z-20">
    <div class="flex items-center gap-1.5 truncate">
      <span class="w-2 h-2 rounded-full bg-[#FEE500] shrink-0"></span>
      <span class="truncate">단톡방 페이스톡 화면공유를 켜면 이 화면이 실시간 생중계됩니다!</span>
    </div>
    <button onclick="reloadPinball()" class="text-rose-400 font-bold shrink-0 ml-2 hover:underline">
      새로고침 🔄
    </button>
  </footer>

  <!-- 1. 단톡방 초대 모달 -->
  <div id="invite-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-3xl p-5 shadow-2xl text-center animate-pop space-y-3">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-500/20 border border-emerald-400 flex items-center justify-center text-2xl">
        📋
      </div>
      <div>
        <h3 class="text-base font-black text-white title-font">초대 주소가 복사되었습니다!</h3>
        <p class="text-xs text-slate-300 mt-1 leading-relaxed">
          카카오톡 단톡방 입력창에 <strong>붙여넣기</strong> 해주세요.
        </p>
      </div>
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-[11px] text-amber-400 break-all select-all font-mono" id="invite-url-box">
        -
      </div>
      <button onclick="closeModal('invite-modal')" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition">
        확인
      </button>
    </div>
  </div>

  <!-- 2. 카톡 화면공유 가이드 모달 (오류 완전 방지) -->
  <div id="share-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-[#FEE500]/50 rounded-3xl p-5 shadow-2xl text-left animate-pop space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-[#FEE500] text-[#191919] flex items-center justify-center font-black text-xl shrink-0">
          💬
        </div>
        <div>
          <h3 class="text-base font-black text-white title-font">카톡 화면공유 켜는 법</h3>
          <p class="text-[11px] text-slate-400">핸드폰 화면을 친구들에게 생중계합니다</p>
        </div>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-2 text-xs text-slate-300">
        <div class="flex items-start gap-2">
          <span class="w-5 h-5 rounded-full bg-slate-800 text-amber-400 flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">1</span>
          <span>친구들과 있는 <strong>카카오톡 단톡방</strong>을 엽니다.</span>
        </div>
        <div class="flex items-start gap-2">
          <span class="w-5 h-5 rounded-full bg-slate-800 text-amber-400 flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">2</span>
          <span>하단 <strong>[+]</strong> 버튼 누르고 <strong>[페이스톡]</strong>을 연결합니다.</span>
        </div>
        <div class="flex items-start gap-2">
          <span class="w-5 h-5 rounded-full bg-slate-800 text-amber-400 flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">3</span>
          <span>통화 화면 아래 <strong>[화면공유]</strong> 아이콘을 켭니다.</span>
        </div>
        <div class="flex items-start gap-2">
          <span class="w-5 h-5 rounded-full bg-slate-800 text-amber-400 flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">4</span>
          <span>다시 <strong>이 화면으로 돌아와 구슬을 발사</strong>하면 끝!</span>
        </div>
      </div>

      <button onclick="closeModal('share-modal')" class="w-full py-2.5 bg-[#FEE500] text-[#191919] text-xs font-black rounded-xl shadow transition active:scale-95">
        알겠습니다, 진행하기
      </button>
    </div>
  </div>

  <script>
    // 1. 초대 링크 복사 (에러 없는 텍스트영역 방식)
    function openInviteModal() {
      const url = window.location.href;
      document.getElementById('invite-url-box').innerText = url;

      const temp = document.createElement('textarea');
      temp.value = `🎰 [세미니의 놀이터 - 복불복 핀볼]\n친구들과 함께하는 복불복 추첨판입니다! 아래 링크로 들어오세요!\n👉 ${url}`;
      temp.style.position = 'fixed';
      temp.style.top = '-9999px';
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand('copy');
      } catch (e) {}
      document.body.removeChild(temp);

      document.getElementById('invite-modal').classList.remove('hidden');
    }

    // 2. 화면공유 버튼 클릭 시 (에러를 유발하던 kakaotalk:// 스키마 제거)
    function openShareGuideModal() {
      document.getElementById('share-modal').classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function reloadPinball() {
      const frame = document.getElementById('pinball-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
