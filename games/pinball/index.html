<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>복불복 핀볼 룸 - 세미니의 놀이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      background: #09090b;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .title-font { font-family: 'Black Han Sans', 'Jua', sans-serif; }
  </style>
</head>
<body class="text-white flex flex-col justify-between">

  <!-- 카카오톡 스타일 상단 헤더 -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0 shadow-lg z-20">
    <div class="flex items-center gap-2">
      <button onclick="location.href='../../index.html'" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-1">
        <span>◀</span> 로비
      </button>
      <h1 class="text-base sm:text-lg font-black text-rose-400 title-font flex items-center gap-1">
        <span>🎰</span> 복불복 핀볼
      </h1>
    </div>

    <!-- 액션 버튼 세트 -->
    <div class="flex items-center gap-1.5">
      <!-- 1. 단톡방 초대 버튼 (카카오톡 오류 완벽 패치) -->
      <button onclick="shareToKakaoSafe()" class="px-3 py-1.5 bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs rounded-xl shadow-md transition flex items-center gap-1">
        <span>📤</span> 단톡방 초대
      </button>

      <!-- 2. 카카오톡 실행 및 화면공유 안내 버튼 -->
      <button onclick="openKakaoApp()" class="px-3.5 py-1.5 bg-[#FEE500] hover:bg-[#FDD835] active:bg-[#E5CB00] text-[#191919] font-black text-xs rounded-xl shadow-md transition flex items-center gap-1.5 active:scale-95">
        <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24">
          <path d="M12 3c-5.52 0-10 3.58-10 8 0 2.87 1.88 5.38 4.72 6.74-.21.78-.76 2.81-.87 3.24-.14.54.2.53.42.38.17-.11 2.76-1.87 3.86-2.63.61.08 1.24.13 1.87.13 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
        </svg>
        <span>카톡 화면공유</span>
      </button>
    </div>
  </header>

  <!-- 원본 핀볼 웹뷰 영역 -->
  <main class="w-full flex-1 relative bg-slate-950 overflow-hidden">
    <iframe 
      id="pinball-frame"
      src="https://lazygyu.github.io/roulette/" 
      class="w-full h-full border-0 block"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
      loading="eager">
    </iframe>
  </main>

  <!-- 하단 원포인트 가이드 바 -->
  <footer class="w-full bg-slate-900/95 border-t border-slate-800 px-3 py-2 flex items-center justify-between text-[11px] text-slate-300 shrink-0">
    <div class="flex items-center gap-1.5 truncate">
      <span class="w-2 h-2 rounded-full bg-[#FEE500] shrink-0"></span>
      <span class="truncate">카톡 단톡방에서 <strong>[페이스톡 ▶ 화면공유]</strong>를 켜면 친구들과 함께 봅니다!</span>
    </div>
    <button onclick="reloadPinball()" class="text-rose-400 font-bold shrink-0 ml-2 hover:underline">
      새로고침 🔄
    </button>
  </footer>

  <script>
    // 카카오톡 '알 수 없는 오류' 방지용 안전 공유 함수
    async function shareToKakaoSafe() {
      const shareUrl = window.location.href;
      const messageText = `🎰 [세미니의 놀이터 - 복불복 핀볼]\n친구들과 함께하는 복불복 추첨판입니다! 아래 링크로 들어와서 같이 보세요!\n\n👉 링크: ${shareUrl}`;

      // 카카오톡 등 메신저 호환성을 위해 URL을 별도 필드가 아닌 text 안에 병합
      if (navigator.share) {
        try {
          await navigator.share({
            text: messageText
          });
          return;
        } catch (err) {
          // 사용자가 공유창에서 취소(AbortError)한 경우는 알림 생략
          if (err.name === 'AbortError') return;
          console.warn('공유 API 실패, 클립보드 복사로 대체:', err);
        }
      }

      // 공유 실패하거나 미지원 브라우저일 때: 안전 복사 Fallback
      fallbackCopy(shareUrl);
    }

    // 클립보드 안전 복사 (구형 폰/보안 브라우저 호환)
    function fallbackCopy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          alert('🎉 초대 링크가 복사되었습니다!\n\n카카오톡 단톡방에 붙여넣기(Ctrl+V 또는 길게 눌러 붙여넣기) 해주세요.');
        }).catch(() => {
          manualCopyPrompt(text);
        });
      } else {
        manualCopyPrompt(text);
      }
    }

    function manualCopyPrompt(text) {
      const tempInput = document.createElement('textarea');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      alert('🎉 초대 링크가 복사되었습니다!\n\n카카오톡 단톡방에 붙여넣어 주세요.');
    }

    // 카카오톡 앱 열기
    function openKakaoApp() {
      // 카카오톡 앱 스키마 실행
      const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
      if (isMobile) {
        window.location.href = "kakaolink://";
      } else {
        window.location.href = "kakaotalk://";
      }

      // 0.4초 후 가이드 알림창 표시
      setTimeout(() => {
        alert("📌 [카카오톡 화면공유 방법]\n\n1. 열린 단톡방에서 '페이스톡' 연결\n2. 통화 화면 아래 [화면 공유] 아이콘 터치\n3. 다시 이 핀볼 화면으로 돌아오면 친구들이 실시간으로 보게 됩니다!");
      }, 400);
    }

    function reloadPinball() {
      const frame = document.getElementById('pinball-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
