<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>복불복 핀볼 룸 - 세미니의 놀이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      background: #09090b;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .title-font { font-family: 'Black Han Sans', 'Jua', sans-serif; }
  </style>
</head>
<body class="text-white flex flex-col justify-between">

  <!-- 카카오톡 스타일 상단 헤더 -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0 shadow-lg z-20">
    <div class="flex items-center gap-2">
      <button onclick="location.href='../../index.html'" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-1">
        <span>◀</span> 로비
      </button>
      <h1 class="text-base sm:text-lg font-black text-rose-400 title-font flex items-center gap-1">
        <span>🎰</span> 복불복 핀볼
      </h1>
    </div>

    <!-- 카카오톡 전용 원터치 액션 버튼 세트 -->
    <div class="flex items-center gap-1.5">
      <!-- 1. 단톡방에 게임 링크 및 참여 안내 원클릭 공유 -->
      <button onclick="shareToKakao()" class="px-3 py-1.5 bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs rounded-xl shadow-md transition flex items-center gap-1">
        <span>📤</span> 단톡방 초대
      </button>

      <!-- 2. 카카오톡 앱 즉시 실행 및 페이스톡 화면공유 연결 -->
      <button onclick="launchKakaoShare()" class="px-3.5 py-1.5 bg-[#FEE500] hover:bg-[#FDD835] active:bg-[#E5CB00] text-[#191919] font-black text-xs rounded-xl shadow-md transition flex items-center gap-1.5 active:scale-95">
        <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24">
          <path d="M12 3c-5.52 0-10 3.58-10 8 0 2.87 1.88 5.38 4.72 6.74-.21.78-.76 2.81-.87 3.24-.14.54.2.53.42.38.17-.11 2.76-1.87 3.86-2.63.61.08 1.24.13 1.87.13 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
        </svg>
        <span>카톡 화면공유</span>
      </button>
    </div>
  </header>

  <!-- 원본 핀볼 웹뷰 영역 (모바일 화면 100% 핏) -->
  <main class="w-full flex-1 relative bg-slate-950 overflow-hidden">
    <iframe 
      id="pinball-frame"
      src="https://lazygyu.github.io/roulette/" 
      class="w-full h-full border-0 block"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
      loading="eager">
    </iframe>
  </main>

  <!-- 하단 원포인트 가이드 바 -->
  <footer class="w-full bg-slate-900/95 border-t border-slate-800 px-3 py-2 flex items-center justify-between text-[11px] text-slate-300 shrink-0">
    <div class="flex items-center gap-1.5 truncate">
      <span class="w-2 h-2 rounded-full bg-[#FEE500] shrink-0"></span>
      <span class="truncate">카톡 단톡방에서 <strong>[페이스톡 ▶ 화면공유]</strong>를 켜면 친구들과 함께 봅니다!</span>
    </div>
    <button onclick="reloadPinball()" class="text-rose-400 font-bold shrink-0 ml-2 hover:underline">
      새로고침 🔄
    </button>
  </footer>

  <script>
    // 1. 카카오톡 단톡방으로 초대 메시지 발송
    function shareToKakao() {
      const shareData = {
        title: '세미니의 놀이터 - 복불복 핀볼 룰렛',
        text: '🎰 복불복 핀볼 추첨 시작합니다! 카톡 화면공유로 들어와서 같이 보세요! 🎈',
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert('🎉 링크가 복사되었습니다!\n카카오톡 단톡방에 붙여넣어 친구들을 초대하세요.');
        }).catch(() => {
          prompt('초대 주소를 복사해 단톡방에 전달하세요:', window.location.href);
        });
      }
    }

    // 2. 카카오톡 앱 즉시 호출
    function launchKakaoShare() {
      const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
      
      // 모바일 기기일 때 카카오톡 공식 딥링크 호출
      if (isMobile) {
        window.location.href = "kakaolink://";
      } else {
        window.location.href = "kakaoopen://";
      }

      // 화면공유 간단 안내 팝업
      setTimeout(() => {
        alert("📌 [카카오톡 화면공유 3초 가이드]\n\n1. 열린 카카오톡 단톡방 메뉴(+)에서 '페이스톡' 연결\n2. 통화 창 하단의 [화면 공유] 아이콘 터치\n3. 다시 이 핀볼 화면으로 돌아와 구슬을 떨어뜨리세요!");
      }, 400);
    }

    function reloadPinball() {
      const frame = document.getElementById('pinball-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
