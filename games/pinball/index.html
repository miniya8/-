<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 뷰포트 최적화: 가로 잘림 방지 및 Safe Area(노치, 하단 바) 대응 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 즉시 리다이렉트 메타 태그 -->
  <meta http-equiv="refresh" content="0; url=https://rd.dsms.kr/">
  <title>이동 중...</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh; /* 모바일 동적 브라우저 주소창 높이 대응 */
      background-color: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      /* 아이폰 노치 및 제스처 바 여백 처리 */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 400px;
      padding: 24px 20px;
      word-break: keep-all;
      line-height: 1.6;
    }

    .loading-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      margin: 0 auto 18px auto;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    p {
      font-size: 15px;
      color: #e2e8f0;
      margin-bottom: 12px;
    }

    a {
      color: #38bdf8;
      text-decoration: underline;
      font-weight: 600;
      word-break: break-all;
    }
  </style>

  <script>
    // 자바스크립트로 즉시 이동 처리 (뒤로가기 방지 및 브라우저 호환성)
    window.location.replace("https://rd.dsms.kr/");
  </script>
</head>
<body>
  <div class="container">
    <div class="loading-spinner"></div>
    <p>사이트로 연결 중입니다...</p>
    <p style="font-size: 13px; color: #94a3b8;">
      자동으로 이동하지 않으면 <a href="https://rd.dsms.kr/">여기</a>를 터치해 주세요.
    </p>
  </div>
</body>
</html>
