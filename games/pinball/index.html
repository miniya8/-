<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>복불복 핀볼 룸 - 세미니의 놀이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    html, body {
      height: 100%;
      height: 100dvh; /* 모바일 주소창 높이 변화 완벽 대응 */
      margin: 0;
      padding: 0;
      overflow: hidden; /* 모바일 이중 스크롤 방지 */
      font-family: 'Noto Sans KR', sans-serif;
      background: #09090b;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .title-font { font-family: 'Black Han Sans', 'Jua', sans-serif; }

    /* 아이프레임 터치 스크롤 최적화 */
    .mobile-iframe-wrapper {
      -webkit-overflow-scrolling: touch;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="text-white flex flex-col justify-between">

  <!-- 모바일 상단 미니멀 헤더 -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 px-3 py-2.5 flex items-center justify-between shrink-0 shadow-lg z-20">
    <div class="flex items-center gap-2">
      <button onclick="location.href='../../index.html'" class="px-2.5 py-1 bg-slate-800 active:bg-slate-700 text-xs font-bold rounded-lg border border-slate-700 transition flex items-center gap-1">
        <span>◀</span> 로비
      </button>
      <h1 class="text-base sm:text-lg font-black text-rose-400 title-font flex items-center gap-1">
        <span>🎰</span> 복불복 핀볼
      </h1>
    </div>

    <!-- 모바일 핵심 액션 버튼 -->
    <div class="flex items-center gap-1.5">
      <button onclick="shareGameLink()" class="px-3 py-1.5 bg-emerald-600 active:bg-emerald-500 text-xs font-black rounded-xl shadow transition flex items-center gap-1">
        <span>📤</span> 친구 초대
      </button>
      <button onclick="openExternalMobile()" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition">
        새창 ↗
      </button>
    </div>
  </header>

  <!-- 메인 원본 핀볼 뷰포트 (모바일 화면 100% 꽉 채움) -->
  <main class="w-full flex-1 relative bg-slate-950 overflow-hidden">
    <div class="mobile-iframe-wrapper">
      <iframe 
        id="pinball-frame"
        src="https://lazygyu.github.io/roulette/" 
        class="w-full h-full border-0 block"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
        loading="eager">
      </iframe>
    </div>
  </main>

  <!-- 모바일 하단 플로팅 팁 바 -->
  <footer class="w-full bg-slate-900/90 border-t border-slate-800/80 px-3 py-1.5 flex items-center justify-between text-[11px] text-slate-400 shrink-0">
    <span class="flex items-center gap-1.5 truncate">
      <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
      <span class="truncate">디스코드 모바일 화면 공유 또는 카톡 음성방과 함께 쓰세요!</span>
    </span>
    <button onclick="reloadPinball()" class="text-rose-400 font-bold shrink-0 ml-2">
      새로고침 🔄
    </button>
  </footer>

  <script>
    const ORIGINAL_URL = 'https://lazygyu.github.io/roulette/';

    // 1. 스마트폰 네이티브 공유 API (카카오톡, 디스코드, 메시지 바로 전송)
    function shareGameLink() {
      const shareData = {
        title: '세미니의 놀이터 - 복불복 핀볼 룰렛',
        text: '복불복 핀볼 추첨 판으로 들어와서 같이 보자! 🎰🎈',
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        // 공유 API 미지원 브라우저는 클립보드 복사
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert('링크가 복사되었습니다! 친구들에게 전달하세요.');
        }).catch(() => {
          prompt('초대 주소를 복사하세요:', window.location.href);
        });
      }
    }

    // 2. 외부 브라우저 단독 새창 열기
    function openExternalMobile() {
      window.open(ORIGINAL_URL, '_blank');
    }

    // 3. 핀볼 화면 새로고침
    function reloadPinball() {
      const frame = document.getElementById('pinball-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
