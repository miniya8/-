<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>복불복 핀볼 라이브 룸 - 세미니의 놀이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      background: #09090b;
      user-select: none;
      -webkit-user-select: none;
    }
    .title-font { font-family: 'Black Han Sans', 'Jua', sans-serif; }
  </style>
</head>
<body class="text-white flex flex-col justify-between">

  <!-- 상단 간편 제어 헤더 -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0 shadow-lg z-20">
    <div class="flex items-center gap-2">
      <button onclick="location.href='../../index.html'" class="px-2.5 py-1 bg-slate-800 active:bg-slate-700 text-xs font-bold rounded-lg border border-slate-700 transition">
        ◀ 로비
      </button>
      <h1 class="text-base sm:text-lg font-black text-rose-400 title-font flex items-center gap-1">
        <span>🎰</span> 복불복 핀볼
      </h1>
    </div>

    <!-- 원클릭 방송 & 링크 공유 버튼 세트 -->
    <div class="flex items-center gap-1.5">
      <!-- 1. 방장용: 클릭 한 번으로 무설치 방송실 오픈 -->
      <button onclick="startBroadcast()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-xs font-black rounded-xl shadow-md transition flex items-center gap-1 animate-pulse">
        <span>🔴</span> 방송 시작
      </button>
      
      <!-- 2. 친구 초대용: 무설치 웹 시청 링크 자동 복사/공유 -->
      <button onclick="shareViewerLink()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-xs font-black rounded-xl shadow-md transition flex items-center gap-1">
        <span>📤</span> 친구 초대
      </button>
    </div>
  </header>

  <!-- 메인 핀볼 게임 화면 -->
  <main class="w-full flex-1 relative bg-slate-950 overflow-hidden">
    <iframe 
      id="pinball-frame"
      src="https://lazygyu.github.io/roulette/" 
      class="w-full h-full border-0 block"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
      loading="eager">
    </iframe>
  </main>

  <!-- 하단 상태 바 -->
  <footer class="w-full bg-slate-900/90 border-t border-slate-800/80 px-3 py-1.5 flex items-center justify-between text-[11px] text-slate-400 shrink-0">
    <span class="flex items-center gap-1.5 truncate">
      <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
      <span id="room-status-text" class="truncate">친구들은 앱 설치 없이 링크만 누르면 바로 시청합니다!</span>
    </span>
    <button onclick="reloadPinball()" class="text-rose-400 font-bold shrink-0 ml-2">
      새로고침 🔄
    </button>
  </footer>

  <script>
    // 날짜/시간 기반으로 고유 룸 번호 생성 (매번 충돌 없는 새 방 유지)
    const savedRoomId = localStorage.getItem('semin_live_room_id') || ('semin-live-' + Math.random().toString(36).substring(2, 7));
    localStorage.setItem('semin_live_room_id', savedRoomId);

    // 무설치 웹 화상/화면공유 주소 (Jitsi 공용 서버)
    const LIVE_STREAM_URL = `https://meet.jit.si/${savedRoomId}#config.startWithAudioMuted=true&config.prejoinPageEnabled=false`;

    // [1] 방장: 버튼 1번으로 화면공유 방 열기
    function startBroadcast() {
      // 팝업창 형태로 방송룸 호출
      window.open(LIVE_STREAM_URL, 'semin_broadcast', 'width=500,height=700,menubar=no,status=no');
      
      setTimeout(() => {
        alert("📌 [방송 시작 안내]\n\n열린 새 창에서 하단 [모니터(화면 공유) 아이콘]만 누르면 끝!\n그 다음 '친구 초대' 버튼을 눌러 링크를 단톡방에 보내세요.");
      }, 300);
    }

    // [2] 친구들: 앱/로그인 전혀 없이 웹에서 바로 보는 링크 전송
    function shareViewerLink() {
      const shareData = {
        title: '세미니의 놀이터 - 핀볼 실시간 생방송',
        text: '🎰 복불복 핀볼 실시간 화면 공유방입니다! (어플 설치 없이 바로 볼 수 있어요)',
        url: LIVE_STREAM_URL
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        navigator.clipboard.writeText(LIVE_STREAM_URL).then(() => {
          alert('🎉 무설치 시청 링크가 복사되었습니다!\n\n카카오톡 단톡방에 붙여넣어 친구들에게 공유하세요:\n' + LIVE_STREAM_URL);
        }).catch(() => {
          prompt('아래 링크를 친구들에게 보내주세요:', LIVE_STREAM_URL);
        });
      }
    }

    function reloadPinball() {
      const frame = document.getElementById('pinball-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
